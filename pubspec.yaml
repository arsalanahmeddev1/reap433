name: reap433
description: "Reap433 Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  pinput: ^6.0.2
  flutter_launcher_icons: ^0.14.4
  http: ^1.6.0
  another_flushbar: ^2.2.4
  shimmer: ^3.0.0
  intl: ^0.20.3
  url_launcher: ^6.3.2
  keyboard_actions: ^5.0.2
  translator: ^1.0.4+1
  firebase_core: ^4.13.0
  lottie: ^3.3.3
  image_picker: ^1.2.3
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.2.0
  firebase_messaging: ^16.6.0
  get_storage: ^2.1.1
  flutter_local_notifications: ^19.4.0
  audioplayers: ^6.7.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/
    - assets/svg/
    - assets/png/
    - assets/lotties/
    - assets/sounds/

 
  fonts:
    - family: Parastoo
      fonts:
        - asset: assets/fonts/Parastoo-Regular.ttf
        - asset: assets/fonts/Parastoo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Parastoo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Parastoo-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/png/app_icon.png"        
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  remove_alpha_ios: true