<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reap433 Bible Trivia — Seven decks covering Faith, Baptism, Tithing, Salvation, Holy Spirit, Spiritual Gifts, and Reap What You Sow." />
  <title>Reap433 — Bible Trivia Decks</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      background: #f7f1e3;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body>
<div id="reap433-decks"></div>

<style>
#reap433-decks * { box-sizing: border-box; }
  #reap433-decks {
    --bg1: #f7f1e3;
    --bg2: #efe6d2;
    --card: #fffdf8;
    --border: #e2d6bf;
    --ink: #3a2f25;
    --muted: #6b5d4f;
    --faint: #a89a89;
    --good-bg: #eef3e8;
    --good-border: #5b7c4f;
    --good-text: #3f5536;
    --bad-bg: #f7e9e3;
    --bad-border: #a8552c;
    --bad-text: #7a3a1e;
    --note-bg: #f4ecda;

    min-height: 100vh;
    width: 100%;
    background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    font-family: Georgia, 'Iowan Old Style', serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 56px;
  }

  /* ---------- shared header ---------- */
  #reap433-decks .eyebrow {
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #a8552c;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 700;
    margin-bottom: 8px;
  }
  #reap433-decks .title {
    font-size: clamp(28px, 6vw, 44px);
    margin: 0 0 8px;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-align: center;
  }
  #reap433-decks .sub {
    font-size: 15px;
    color: var(--muted);
    margin: 0;
    line-height: 1.5;
    text-align: center;
    max-width: 640px;
  }
  #reap433-decks .header {
    text-align: center;
    margin-bottom: 28px;
    max-width: 640px;
  }

  /* ---------- menu screen ---------- */
  #reap433-decks .deck-grid {
    width: 100%;
    max-width: 640px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  @media (min-width: 560px) {
    #reap433-decks .deck-grid { grid-template-columns: 1fr 1fr; }
  }
  #reap433-decks .deck-tile {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(58,47,37,0.07);
    overflow: hidden;
    text-align: left;
    cursor: pointer;
    padding: 0;
    width: 100%;
    font-family: inherit;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  #reap433-decks .deck-tile:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(58,47,37,0.12);
  }
  #reap433-decks .deck-bar {
    height: 6px;
    width: 100%;
  }
  #reap433-decks .deck-body {
    padding: 18px 20px 20px;
  }
  #reap433-decks .deck-name {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 6px;
    color: var(--ink);
  }
  #reap433-decks .deck-verse {
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--muted);
    margin: 0 0 10px;
    font-style: italic;
  }
  #reap433-decks .deck-meta {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--faint);
  }

  /* ---------- gameplay ---------- */
  #reap433-decks .back-link {
    align-self: flex-start;
    width: 100%;
    max-width: 520px;
    margin: 0 0 14px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    text-align: left;
  }
  #reap433-decks .back-link:hover { color: var(--ink); }

  #reap433-decks .stats {
    display: flex;
    gap: 16px;
    margin-bottom: 18px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    color: var(--muted);
  }
  #reap433-decks .stats strong { color: var(--ink); }
  #reap433-decks .progress {
    width: 100%;
    max-width: 520px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  #reap433-decks .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  #reap433-decks .card {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(58,47,37,0.07);
    overflow: hidden;
    animation: flipIn 0.35s ease-out;
  }
  @keyframes flipIn {
    from { transform: translateY(6px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  #reap433-decks .band {
    color: #fffdf8;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  #reap433-decks .band-label {
    font-weight: 700;
    letter-spacing: 0.08em;
    font-size: 13px;
    text-transform: uppercase;
  }
  #reap433-decks .band-desc { font-size: 11px; opacity: 0.85; }
  #reap433-decks .body { padding: 24px 24px 20px; }
  #reap433-decks .question {
    font-size: 19px;
    line-height: 1.5;
    margin: 0 0 20px;
    font-weight: 600;
  }
  #reap433-decks .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #reap433-decks .opt {
    text-align: left;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--ink);
    font-size: 15px;
    font-family: Georgia, serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  #reap433-decks .opt:hover:not(.locked) {
    transform: translateY(-1px);
    border-color: #a8552c;
  }
  #reap433-decks .opt.locked { cursor: default; }
  #reap433-decks .opt.correct {
    background: var(--good-bg);
    border-color: var(--good-border);
    color: var(--good-text);
  }
  #reap433-decks .opt.incorrect {
    background: var(--bad-bg);
    border-color: var(--bad-border);
    color: var(--bad-text);
  }
  #reap433-decks .opt.dim { color: var(--faint); }
  #reap433-decks .opt-letter {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--faint);
    min-width: 16px;
  }
  #reap433-decks .mark { margin-left: auto; font-size: 12px; }
  #reap433-decks .note {
    margin-top: 18px;
    padding: 14px 16px;
    background: var(--note-bg);
    border-radius: 8px;
    font-size: 13.5px;
    line-height: 1.6;
    color: #5c4d3c;
    display: none;
  }
  #reap433-decks .note.show { display: block; }
  #reap433-decks .note-ref {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  #reap433-decks .next-btn {
    margin-top: 20px;
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    background: var(--border);
    color: var(--faint);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.04em;
    cursor: default;
    transition: background 0.15s ease, transform 0.08s ease;
  }
  #reap433-decks .next-btn.active {
    background: var(--ink);
    color: #fffdf8;
    cursor: pointer;
  }
  #reap433-decks .next-btn:active.active { transform: scale(0.98); }

  #reap433-decks .final {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(58,47,37,0.07);
    padding: 36px 28px;
    text-align: center;
    animation: flipIn 0.35s ease-out;
  }
  #reap433-decks .final-eyebrow {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #a8552c;
    font-weight: 700;
    margin-bottom: 10px;
  }
  #reap433-decks .final-score {
    font-size: 38px;
    font-weight: 700;
    margin: 0 0 6px;
  }
  #reap433-decks .final-msg {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 24px;
    line-height: 1.6;
  }
  #reap433-decks .final-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  #reap433-decks .btn-solid,
  #reap433-decks .btn-outline {
    padding: 13px 24px;
    border-radius: 8px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  #reap433-decks .btn-solid {
    border: none;
    background: var(--ink);
    color: #fffdf8;
  }
  #reap433-decks .btn-outline {
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--ink);
  }
  #reap433-decks .btn-solid:active,
  #reap433-decks .btn-outline:active { transform: scale(0.98); }

  @media (prefers-reduced-motion: reduce) {
    #reap433-decks .card, #reap433-decks .final { animation: none; }
    #reap433-decks .opt, #reap433-decks .next-btn,
    #reap433-decks .btn-solid, #reap433-decks .btn-outline,
    #reap433-decks .deck-tile { transition: none; }
  }
</style>

<script>
(function () {
  var DECKS = {
    faith: {
      title: "Faith",
      color: "#5b7c4f",
      verse: "“Now faith is the substance of things hoped for, the evidence of things not seen.”",
      ref: "Hebrews 11:1",
      desc: "Believing, trusting, walking by what is unseen",
      cards: [
        {
          q: "Hebrews 11:1 defines faith as the substance of things hoped for, and the evidence of...?",
          options: [
            "Things to come",
            "Things not seen",
            "Things believed",
            "Things eternal"
          ],
          answer: 1,
          ref: "Hebrews 11:1",
          note: "The classic biblical definition of faith — confidence in what cannot yet be seen."
        },
        {
          q: "Romans 10:17 says faith comes by hearing, and hearing by what?",
          options: [
            "Prayer",
            "The word of God",
            "Tradition",
            "The Spirit's voice"
          ],
          answer: 1,
          ref: "Romans 10:17",
          note: "Faith is rooted in the proclaimed word, not abstract feeling."
        },
        {
          q: "Ephesians 2:8 says salvation through faith is, itself, a ___ of God.",
          options: [
            "Mercy",
            "Gift",
            "Will",
            "Promise"
          ],
          answer: 1,
          ref: "Ephesians 2:8-9",
          note: "‘Not of works, lest any man should boast’ (v.9)."
        },
        {
          q: "James 2:17 says faith without works is what?",
          options: [
            "Incomplete",
            "Weak",
            "Dead",
            "Useless to others"
          ],
          answer: 2,
          ref: "James 2:17",
          note: "‘Even so faith, if it hath not works, is dead, being alone.’"
        },
        {
          q: "Jesus says if you have faith as a grain of ___, you could tell a mountain to move and it would obey.",
          options: [
            "Wheat",
            "Mustard seed",
            "Sand",
            "Salt"
          ],
          answer: 1,
          ref: "Matthew 17:20",
          note: "A picture of small faith producing outsized results through God's power."
        },
        {
          q: "Hebrews 11:6 says without faith it is impossible to do what?",
          options: [
            "Pray",
            "Please God",
            "Receive grace",
            "Enter heaven"
          ],
          answer: 1,
          ref: "Hebrews 11:6",
          note: "‘For he that cometh to God must believe that he is, and that he is a rewarder of them that diligently seek him.’"
        },
        {
          q: "Genesis 15:6 says Abraham believed the Lord, and it was counted to him as...?",
          options: [
            "Faithfulness",
            "Righteousness",
            "Wisdom",
            "Blessing"
          ],
          answer: 1,
          ref: "Genesis 15:6",
          note: "Foundational text Paul builds on in Romans 4 and Galatians 3 for justification by faith."
        },
        {
          q: "Hebrews 11 highlights this figure for building an ark in faith before any rain had fallen.",
          options: [
            "Abraham",
            "Noah",
            "Moses",
            "Enoch"
          ],
          answer: 1,
          ref: "Hebrews 11:7",
          note: "Noah, ‘being warned of God... prepared an ark for the saving of his house.’"
        },
        {
          q: "When Peter began to sink while walking on water, Jesus asked, ‘O thou of little faith, wherefore didst thou ___?’",
          options: [
            "Fear",
            "Doubt",
            "Fall",
            "Sink"
          ],
          answer: 1,
          ref: "Matthew 14:31",
          note: "Faith and doubt are pictured side by side in the same moment."
        },
        {
          q: "2 Corinthians 5:7 says, ‘For we walk by faith, not by ___.’",
          options: [
            "Works",
            "Sight",
            "Law",
            "Fear"
          ],
          answer: 1,
          ref: "2 Corinthians 5:7",
          note: "A guiding posture for how believers are to move through life."
        },
        {
          q: "1 John 5:4 says the victory that overcomes the world is...?",
          options: [
            "Love",
            "Faith",
            "Hope",
            "Obedience"
          ],
          answer: 1,
          ref: "1 John 5:4",
          note: "‘This is the victory that overcomes the world, even our faith.’"
        },
        {
          q: "When the apostles asked Jesus to increase their faith, he said faith like a mustard seed could uproot what kind of tree?",
          options: [
            "A mountain",
            "A fig tree",
            "A sycamine tree",
            "A cedar"
          ],
          answer: 2,
          ref: "Luke 17:5-6",
          note: "A sycamine (mulberry-type) tree — known for an especially deep, stubborn root system."
        }
      ]
    },
    baptism: {
      title: "Baptism",
      color: "#4a7c94",
      verse: "“Therefore we are buried with him by baptism into death... that we also should walk in newness of life.”",
      ref: "Romans 6:4",
      desc: "Water, the Spirit, and being joined to Christ",
      cards: [
        {
          q: "At Jesus' baptism, what descended on him like a dove as a voice declared, ‘This is my beloved Son’?",
          options: [
            "An angel",
            "Fire",
            "The Holy Spirit",
            "A cloud"
          ],
          answer: 2,
          ref: "Matthew 3:16-17",
          note: "All three Persons are present at this moment — Father's voice, Son in the water, Spirit descending."
        },
        {
          q: "In the Great Commission, Jesus commands baptism ‘in the name of the Father, and of the Son, and of the ___.’",
          options: [
            "Holy Spirit",
            "Kingdom",
            "Church",
            "Covenant"
          ],
          answer: 0,
          ref: "Matthew 28:19",
          note: "The baptismal formula tied to discipleship and the Great Commission."
        },
        {
          q: "In Acts 2:38, Peter tells the crowd that those who repent and are baptized will receive what?",
          options: [
            "Healing",
            "The gift of the Holy Spirit",
            "Eternal life",
            "A new name"
          ],
          answer: 1,
          ref: "Acts 2:38",
          note: "Peter's Pentecost sermon ties repentance, baptism, and the Spirit together."
        },
        {
          q: "Romans 6:4 says we are buried with Christ by baptism into death, so that we might walk in ___ of life.",
          options: [
            "Newness",
            "Fullness",
            "Assurance",
            "Power"
          ],
          answer: 0,
          ref: "Romans 6:3-4",
          note: "Baptism pictures union with Christ's death and resurrection."
        },
        {
          q: "What did the Ethiopian eunuch see that prompted him to ask Philip, ‘What doth hinder me to be baptized?’",
          options: [
            "A river",
            "A dove",
            "Water",
            "A baptismal font"
          ],
          answer: 2,
          ref: "Acts 8:36",
          note: "A simple roadside moment — Philip had just explained Isaiah 53 to him."
        },
        {
          q: "1 Peter 3:21 says baptism is not the removal of dirt from the flesh, but the answer of a good ___ toward God.",
          options: [
            "Heart",
            "Conscience",
            "Faith",
            "Confession"
          ],
          answer: 1,
          ref: "1 Peter 3:21",
          note: "Baptism is framed as an inward reality, not merely a physical washing."
        },
        {
          q: "John the Baptist preached a baptism of ___ for the remission of sins.",
          options: [
            "Fire",
            "Repentance",
            "Water",
            "Cleansing"
          ],
          answer: 1,
          ref: "Mark 1:4",
          note: "John's baptism prepared the way; it pointed forward to Christ."
        },
        {
          q: "When Paul met disciples at Ephesus who had only known John's baptism, he had them baptized into what?",
          options: [
            "The Father's name",
            "The name of the Lord Jesus",
            "The Holy Spirit's name",
            "Repentance"
          ],
          answer: 1,
          ref: "Acts 19:1-5",
          note: "A transition moment from John's preparatory baptism to baptism in Jesus' name."
        },
        {
          q: "Galatians 3:27 says as many as have been baptized into Christ have ‘put on’ what?",
          options: [
            "The armor of God",
            "Christ",
            "The Spirit",
            "Righteousness"
          ],
          answer: 1,
          ref: "Galatians 3:27",
          note: "Clothing imagery — identity is now wrapped up in Christ."
        },
        {
          q: "In the story of Cornelius, what notable thing happened BEFORE he and his household were baptized?",
          options: [
            "They fasted",
            "The Holy Spirit fell on them",
            "An angel appeared to Peter",
            "They were circumcised"
          ],
          answer: 1,
          ref: "Acts 10:44-48",
          note: "Surprising even to Peter — the Spirit came on Gentile believers ahead of water baptism."
        },
        {
          q: "1 Peter 3:20 compares baptism to the salvation of how many people through water in Noah's day?",
          options: [
            "Two",
            "Seven",
            "Eight",
            "Twelve"
          ],
          answer: 2,
          ref: "1 Peter 3:20-21",
          note: "Noah plus his seven family members — eight souls saved through the flood waters."
        },
        {
          q: "Ephesians 4:5 lists ‘one Lord, one faith, one ___’ among the marks of unity in the body.",
          options: [
            "Spirit",
            "Baptism",
            "Hope",
            "Church"
          ],
          answer: 1,
          ref: "Ephesians 4:5",
          note: "Baptism is named as one of the unifying realities of the church."
        }
      ]
    },
    tithing: {
      title: "Tithing",
      color: "#c9962f",
      verse: "“Bring ye all the tithes into the storehouse... and prove me now herewith, saith the Lord of hosts.”",
      ref: "Malachi 3:10",
      desc: "Firstfruits, generosity, and the heart behind giving",
      cards: [
        {
          q: "After defeating his enemies, Abram gave a tenth of everything to whom?",
          options: [
            "Lot",
            "Melchizedek",
            "The king of Sodom",
            "Pharaoh"
          ],
          answer: 1,
          ref: "Genesis 14:18-20",
          note: "Melchizedek, priest-king of Salem — later referenced again in Hebrews 7."
        },
        {
          q: "At Bethel, Jacob vowed that if God brought him back safely, he would give what portion back to God?",
          options: [
            "A fifth",
            "A tenth",
            "Half",
            "All his flocks"
          ],
          answer: 1,
          ref: "Genesis 28:20-22",
          note: "One of the earliest personal tithing vows recorded in Scripture."
        },
        {
          q: "Leviticus 27:30 says all the tithe of the land, whether seed or fruit, belongs to whom?",
          options: [
            "The priest",
            "The king",
            "The Lord",
            "The Levite"
          ],
          answer: 2,
          ref: "Leviticus 27:30",
          note: "‘It is holy unto the Lord’ — the tithe is set apart by definition."
        },
        {
          q: "Malachi 3:10 says if Israel brings the tithe into the storehouse, God will open what?",
          options: [
            "The gates of heaven",
            "The windows of heaven",
            "His treasury",
            "A new covenant"
          ],
          answer: 1,
          ref: "Malachi 3:10",
          note: "A promise of blessing ‘poured out’ in response to obedience and trust."
        },
        {
          q: "Malachi 3:8 accuses Israel of robbing God in what two things?",
          options: [
            "Tithes and offerings",
            "Sacrifices and prayers",
            "Sabbaths and feasts",
            "Firstfruits and vows"
          ],
          answer: 0,
          ref: "Malachi 3:8",
          note: "A sharp indictment that frames withheld giving as theft from God."
        },
        {
          q: "Jesus rebukes the Pharisees for tithing mint, dill, and cumin while neglecting these ‘weightier matters’:",
          options: [
            "Prayer and fasting",
            "Justice, mercy, and faithfulness",
            "Sacrifice and worship",
            "Love and humility"
          ],
          answer: 1,
          ref: "Matthew 23:23",
          note: "Jesus doesn't dismiss tithing — he calls out misplaced priorities around it."
        },
        {
          q: "Hebrews 7 argues that Levi (whose line collects tithes) effectively paid tithes to Melchizedek through whom?",
          options: [
            "Isaac",
            "Jacob",
            "Abraham",
            "Esau"
          ],
          answer: 2,
          ref: "Hebrews 7:1-10",
          note: "The argument: Levi was ‘in the loins’ of Abraham when Abraham tithed to Melchizedek."
        },
        {
          q: "2 Corinthians 9:7 says God loves a giver who gives how?",
          options: [

    function shuffle(arr) {
        var a = arr.slice();

        for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = a[i];
            a[i] = a[j];
            a[j] = tmp;
        }

        return a;
    }

    function getDeck(key) {
        if (!key || !DECKS[key]) {
            return null;
        }

        return DECKS[key];
    }

    function openDeck(key) {
        var deck = getDeck(key);

        if (!deck || !Array.isArray(deck.cards) || deck.cards.length === 0) {
            state.screen = 'play';
            state.deckKey = key;
            state.order = [];
            state.pos = 0;
            state.score = 0;
            state.answered = 0;
            state.revealed = false;
            state.selected = null;
            render();
            return;
        }

        state.screen = 'play';
        state.deckKey = key;
        state.order = shuffle(deck.cards.map(function (_, i) {
            return i;
        }));
        state.pos = 0;
        state.score = 0;
        state.answered = 0;
        state.revealed = false;
        state.selected = null;
        render();
    }

    function goMenu() {
        state.screen = 'menu';
        state.deckKey = null;
        render();
    }

    function render() {
        if (state.screen === 'menu') {
            renderMenu();
            return;
        }

        renderPlay();
    }

    function renderMenu() {
        var html = '';

        html += '<div class="header">'
            + '<div class="eyebrow">Reap433 &middot; Foundations</div>'
            + '<h1 class="title" id="biblical-trivia-heading">Choose a Deck</h1>'
            + '<p class="sub">Seven trivia decks covering Faith, Baptism, Tithing, Salvation, Holy Spirit, Spiritual Gifts, and Reap What You Sow &mdash; '
            + 'each pulling questions and verses straight from Scripture.</p>'
            + '</div>';

        html += '<div class="deck-grid" role="list">';

        DECK_ORDER.forEach(function (key) {
            var d = getDeck(key);
            if (!d) {
                return;
            }

            var cardCount = Array.isArray(d.cards) ? d.cards.length : 0;

            html += '<button type="button" class="deck-tile" data-deck="' + escapeHtml(key) + '" '
                + 'role="listitem" aria-label="' + escapeHtml(d.title + ', ' + cardCount + ' cards') + '">'
                + '<div class="deck-bar" style="background:' + escapeHtml(d.color) + ';"></div>'
                + '<div class="deck-body">'
                + '<p class="deck-name">' + escapeHtml(d.title) + '</p>'
                + '<p class="deck-verse">' + escapeHtml(d.verse) + ' &mdash; ' + escapeHtml(d.ref) + '</p>'
                + '<div class="deck-meta">' + cardCount + ' cards &middot; ' + escapeHtml(d.desc) + '</div>'
                + '</div></button>';
        });

        html += '</div>';

        root.innerHTML = html;

        root.querySelectorAll('.deck-tile').forEach(function (btn) {
            btn.addEventListener('click', function () {
                openDeck(this.getAttribute('data-deck'));
            });
        });
    }

    function renderPlay() {
        var deck = getDeck(state.deckKey);
        var html = '';

        html += '<button type="button" class="back-link" aria-label="Return to all decks">&larr; All decks</button>';

        if (!deck || !Array.isArray(deck.cards) || deck.cards.length === 0) {
            html += '<div class="final" role="alert">'
                + '<p class="final-msg">This deck has no cards yet. Please choose another deck.</p>'
                + '<div class="final-actions">'
                + '<button type="button" class="btn-solid" data-action="menu">Choose another deck</button>'
                + '</div></div>';
            root.innerHTML = html;
            attachPlayHandlers();
            return;
        }

        var finished = state.pos >= state.order.length;

        html += '<div class="header">'
            + '<div class="eyebrow">Reap433 &middot; ' + escapeHtml(deck.title) + '</div>'
            + '<h2 class="title">' + escapeHtml(deck.title) + '</h2>'
            + '<p class="sub">' + escapeHtml(deck.verse) + ' &mdash; ' + escapeHtml(deck.ref) + '</p>'
            + '</div>';

        html += '<div class="stats" aria-live="polite">'
            + '<span>Card <strong>' + Math.min(state.pos + 1, state.order.length) + '</strong> / ' + state.order.length + '</span>'
            + '<span>&middot;</span>'
            + '<span>Score <strong>' + state.score + '</strong> / ' + state.answered + '</span>'
            + '</div>';

        var progressPct = ((state.pos + (finished ? 1 : 0)) / state.order.length) * 100;
        html += '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(progressPct) + '">'
            + '<div class="progress-fill" style="width:' + progressPct + '%; background:' + escapeHtml(deck.color) + ';"></div>'
            + '</div>';

        if (!finished) {
            var card = deck.cards[state.order[state.pos]];

            if (!card) {
                html += '<div class="final" role="alert">'
                    + '<p class="final-msg">Unable to load this card.</p>'
                    + '<button type="button" class="btn-solid" data-action="menu">Back to all decks</button>'
                    + '</div>';
                root.innerHTML = html;
                attachPlayHandlers();
                return;
            }

            html += '<div class="card">';
            html += '<div class="band" style="background:' + escapeHtml(deck.color) + ';">'
                + '<span class="band-label">' + escapeHtml(deck.title) + '</span>'
                + '<span class="band-desc">Card ' + (state.pos + 1) + ' of ' + state.order.length + '</span>'
                + '</div>';
            html += '<div class="body">';
            html += '<p class="question" id="bt-current-question">' + escapeHtml(card.q) + '</p>';
            html += '<div class="options" role="group" aria-labelledby="bt-current-question">';

            card.options.forEach(function (opt, i) {
                var cls = 'opt';
                var mark = '';

                if (state.revealed) {
                    cls += ' locked';
                    if (i === card.answer) {
                        cls += ' correct';
                        mark = '<span class="mark" aria-hidden="true">&#10003;</span>';
                    } else if (i === state.selected) {
                        cls += ' incorrect';
                        mark = '<span class="mark" aria-hidden="true">&#10007;</span>';
                    } else {
                        cls += ' dim';
                    }
                }

                html += '<button type="button" class="' + cls + '" data-idx="' + i + '" '
                    + (state.revealed ? 'disabled aria-disabled="true"' : '')
                    + ' aria-label="Option ' + String.fromCharCode(65 + i) + ': ' + escapeHtml(opt) + '">'
                    + '<span class="opt-letter" aria-hidden="true">' + String.fromCharCode(65 + i) + '</span>'
                    + escapeHtml(opt) + mark
                    + '</button>';
            });

            html += '</div>';

            html += '<div class="note' + (state.revealed ? ' show' : '') + '" '
                + (state.revealed ? '' : 'hidden')
                + ' role="note">'
                + '<div class="note-ref" style="color:' + escapeHtml(deck.color) + ';">' + escapeHtml(card.ref) + '</div>'
                + escapeHtml(card.note)
                + '</div>';

            html += '<button type="button" class="next-btn' + (state.revealed ? ' active' : '') + '" '
                + (state.revealed ? '' : 'disabled aria-disabled="true"')
                + ' aria-label="' + (state.pos + 1 >= state.order.length ? 'Finish deck' : 'Go to next card') + '">'
                + (state.pos + 1 >= state.order.length ? 'Finish' : 'Next card &rarr;')
                + '</button>';

            html += '</div></div>';
        } else {
            var pct = state.order.length > 0 ? state.score / state.order.length : 0;
            var msg = pct === 1
                ? 'A full harvest &mdash; every seed accounted for.'
                : pct >= 0.7
                    ? 'Good soil. Most of it took root.'
                    : 'Some seed fell on rocky ground &mdash; worth another pass.';

            html += '<div class="final">'
                + '<div class="final-eyebrow">Deck Complete</div>'
                + '<p class="final-score" aria-live="polite">' + state.score + ' / ' + state.order.length + '</p>'
                + '<p class="final-msg">' + msg + '</p>'
                + '<div class="final-actions">'
                + '<button type="button" class="btn-solid" data-action="replay">Play again</button>'
                + '<button type="button" class="btn-outline" data-action="menu">Choose another deck</button>'
                + '</div></div>';
        }

        root.innerHTML = html;
        attachPlayHandlers();
    }

    function attachPlayHandlers() {
        var back = root.querySelector('.back-link');
        if (back) {
            back.addEventListener('click', goMenu);
        }

        var deck = getDeck(state.deckKey);

        root.querySelectorAll('.opt').forEach(function (btn) {
            btn.addEventListener('click', function () {
                if (state.revealed || !deck) {
                    return;
                }

                var card = deck.cards[state.order[state.pos]];
                if (!card) {
                    return;
                }

                state.selected = parseInt(this.getAttribute('data-idx'), 10);
                state.revealed = true;
                state.answered += 1;

                if (state.selected === card.answer) {
                    state.score += 1;
                }

                render();
            });

            btn.addEventListener('keydown', function (event) {
                if (state.revealed) {
                    return;
                }

                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    this.click();
                }
            });
        });

        var nextBtn = root.querySelector('.next-btn');
        if (nextBtn) {
            nextBtn.addEventListener('click', function () {
                if (!state.revealed) {
                    return;
                }

                state.pos += 1;
                state.selected = null;
                state.revealed = false;
                render();
            });
        }

        var replayBtn = root.querySelector('[data-action="replay"]');
        if (replayBtn) {
            replayBtn.addEventListener('click', function () {
                openDeck(state.deckKey);
            });
        }

        var menuBtn = root.querySelector('[data-action="menu"]');
        if (menuBtn) {
            menuBtn.addEventListener('click', goMenu);
        }
    }

    render();
}());
</script>

</html>
