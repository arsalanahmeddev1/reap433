<style>
  :root {
    --navy:#11192E; --navyDeep:#0B1120; --panel:#1A2540;
    --gold:#9C7A34; --goldBright:#C9A961; --cream:#F4F0E6; --creamSoft:#EDE7D8;
    --correct:#4E8A6B; --correctB:#7CBE9C; --wrong:#B0503A; --wrongB:#D07A63;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; }
  body {
    min-height:100vh; min-height:100dvh;
    background: radial-gradient(120% 80% at 50% -10%, #1A2540 0%, var(--navy) 45%, var(--navyDeep) 100%);
    background-attachment: fixed;
    font-family:'Source Sans 3', system-ui, -apple-system, sans-serif;
    color: var(--creamSoft);
    display:flex; align-items:center; justify-content:center;
    padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
  }
  #app { width:100%; max-width:480px; }
  .serif { font-family:'Playfair Display', Georgia, 'Times New Roman', serif; }
  .eyebrow { font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--goldBright); font-weight:700; }
  .rule { width:44px; height:2px; background:var(--gold); border:0; border-radius:2px; }
  button { font-family:inherit; cursor:pointer; border:0; transition:transform .15s ease, box-shadow .15s ease, background .2s ease, border-color .18s ease, color .18s ease; }
  button:active { transform: translateY(1px); }
  .primary { background:linear-gradient(180deg, var(--goldBright), var(--gold)); color:var(--navyDeep); font-weight:700; letter-spacing:.04em; }
  .primary:hover { box-shadow:0 6px 22px rgba(156,122,52,.4); }
  .ghost { background:transparent; color:var(--goldBright); font-weight:600; border:1px solid rgba(201,169,97,.4); }
  .answer { text-align:left; width:100%; padding:15px 17px; border-radius:13px; font-size:16px; font-weight:600; line-height:1.35;
    border:1.5px solid rgba(201,169,97,.28); background:var(--panel); color:var(--creamSoft); }
  .answer:not([disabled]):hover { border-color:var(--goldBright); background:#20305A; }
  .answer .lbl { color:var(--goldBright); font-weight:700; margin-right:10px; }
  button:focus-visible, .answer:focus-visible { outline:2px solid var(--goldBright); outline-offset:3px; }
  .chip { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--goldBright);
    border:1px solid rgba(201,169,97,.35); border-radius:999px; padding:5px 11px; font-weight:700; }
  .deck-btn { text-align:left; width:100%; padding:18px 18px; border-radius:14px; background:var(--panel);
    border:1.5px solid rgba(201,169,97,.28); color:var(--creamSoft); }
  .deck-btn:hover { border-color:var(--goldBright); background:#20305A; }
  .reveal { animation: rvl .42s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rvl { from { opacity:0; transform:translateY(14px) scale(.98); } to { opacity:1; transform:none; } }
  .center { text-align:center; }
  .col { display:flex; flex-direction:column; gap:11px; }
  @media (prefers-reduced-motion: reduce) { .reveal { animation:none; } button { transition:none; } }
</style>

<script>
(function () {
  "use strict";

  var DECKS = [{"id":"the-cross","title":"The Cross","subtitle":"The crucifixion in history and theology","cards":[{"cat":"Historical Context","level":"beginner","q":"Which empire is most associated with perfecting crucifixion as a public means of execution?","choices":["Egypt","Rome","Babylon","Greece"],"answer":1,"ref":"John 19:6","note":"Rome refined crucifixion as a deterrent — slow, public, shameful — reserved for slaves, rebels, and non-citizens."},{"cat":"Historical Context","level":"expert","q":"Which people are generally credited with originating crucifixion before Rome adopted it?","choices":["The Persians","The Greeks","The Assyrians","The Philistines"],"answer":0,"ref":"Historical note","note":"The Persians practiced impaling and hanging; Alexander's successors carried it westward, and Rome industrialized it."},{"cat":"Historical Context","level":"intermediate","q":"Roman citizens were normally exempt from crucifixion because it was considered what?","choices":["Too quick a death","Too degrading for a citizen","Too merciful","Too expensive to carry out"],"answer":1,"ref":"Acts 22:25–29","note":"Paul's citizenship spared him the cross; tradition holds he was beheaded instead. Jesus died the death of a slave."},{"cat":"Historical Context","level":"intermediate","q":"What was the 'titulus' fixed to a cross?","choices":["A placard naming the condemned's crime","The soldier's execution order","The nail through the feet","The seat that bore the body's weight"],"answer":0,"ref":"John 19:19","note":"The charge was published so the crowd would learn the lesson. Rome meant it as a warning; God meant it as a proclamation."},{"cat":"Historical Context","level":"beginner","q":"What did Pilate's inscription over Jesus read?","choices":["Jesus, called Christ","Jesus of Galilee, blasphemer","Jesus, enemy of Caesar","Jesus of Nazareth, the King of the Jews"],"answer":3,"ref":"John 19:19","note":"Pilate refused to change it. The mockery was accidentally the most accurate sentence written that day."},{"cat":"Historical Context","level":"intermediate","q":"In how many languages was the inscription written?","choices":["One — Latin only","Two — Hebrew and Greek","Three — Aramaic, Latin, and Greek","Four"],"answer":2,"ref":"John 19:20","note":"Religion, empire, and culture each read the same verdict. The gospel was multilingual from the first hour."},{"cat":"Historical Context","level":"intermediate","q":"Where were Roman crucifixions typically carried out?","choices":["Along public roads and outside city walls","In the temple precincts","In the arena","Inside prison courtyards"],"answer":0,"ref":"Hebrews 13:12","note":"Jesus suffered 'outside the gate' — the place of the unclean and rejected. Hebrews tells us to go to Him there."},{"cat":"Historical Context","level":"expert","q":"What was the crossbeam a condemned man carried to the execution site called?","choices":["The sedile","The patibulum","The stipes","The titulus"],"answer":1,"ref":"John 19:17","note":"The upright post usually stayed fixed in the ground. The condemned carried only the crossbar — still 75 to 125 pounds."},{"cat":"Historical Context","level":"beginner","q":"Who was compelled to carry Jesus' cross?","choices":["Nicodemus","Joseph of Arimathea","Barabbas","Simon of Cyrene"],"answer":3,"ref":"Mark 15:21","note":"A North African pilgrim pressed into service. Mark names his sons — the family was evidently known to the early church."},{"cat":"Historical Context","level":"intermediate","q":"What drink was offered to Jesus before He was crucified?","choices":["Wine mixed with myrrh","Unmixed wine","Water from the Kidron","Vinegar and honey"],"answer":0,"ref":"Mark 15:23","note":"A crude anesthetic. He refused it. He would drink the cup the Father gave Him undulled."},{"cat":"Historical Context","level":"intermediate","q":"Why did the soldiers not break Jesus' legs, as they did the others'?","choices":["Pilate forbade it","The Sabbath had already begun","He was already dead","His mother pleaded with them"],"answer":2,"ref":"John 19:33","note":"Crurifragium hastened death by ending the ability to push up and breathe. Its omission fulfilled the Passover lamb law — not a bone broken."},{"cat":"Historical Context","level":"expert","q":"Roughly how many Jews did Rome crucify at Jerusalem during the siege of AD 70, according to Josephus?","choices":["Fewer than 50","About 100 total","Around 500 a day at the height","Around 12,000 in one hour"],"answer":2,"ref":"Historical note","note":"Josephus says wood ran out. Crucifixion was appallingly common — which is precisely why the identity of the man mattered, not the method."},{"cat":"Passion Narratives","level":"beginner","q":"Which Gospel records the words 'It is finished'?","choices":["Luke","Matthew","John","Mark"],"answer":2,"ref":"John 19:30","note":"John's final word from the cross is not a surrender but a verdict — the work assigned was completed."},{"cat":"Passion Narratives","level":"expert","q":"What single Greek word lies behind 'It is finished'?","choices":["Teleios","Tetelestai","Telos","Tetragrammaton"],"answer":1,"ref":"John 19:30","note":"A commercial term stamped on settled accounts: paid in full. The debt is not reduced — it is closed."},{"cat":"Passion Narratives","level":"beginner","q":"What did the centurion say when Jesus died?","choices":["Truly this man was the Son of God","Let us see if Elijah comes","This man was innocent","Surely He was a prophet"],"answer":0,"ref":"Mark 15:39","note":"The first human confession of Jesus' sonship after the cross comes from a Roman executioner, not a disciple."},{"cat":"Passion Narratives","level":"intermediate","q":"Jesus' cry 'My God, my God, why have you forsaken me?' quotes which psalm?","choices":["Psalm 110","Psalm 23","Psalm 51","Psalm 22"],"answer":3,"ref":"Matthew 27:46","note":"Psalm 22 opens in abandonment and ends in worldwide worship. He quoted the first line and secured the last."},{"cat":"Passion Narratives","level":"intermediate","q":"How many recorded sayings did Jesus speak from the cross across all four Gospels?","choices":["Seven","Twelve","Three","Five"],"answer":0,"ref":"The four Gospels","note":"Forgiveness, paradise, family, abandonment, thirst, completion, and commitment — the whole gospel in seven sentences."},{"cat":"Passion Narratives","level":"beginner","q":"What tore in two at the moment of Jesus' death?","choices":["The scroll of the Law","The temple veil, from top to bottom","Pilate's judgment seat","The high priest's robe"],"answer":1,"ref":"Matthew 27:51","note":"Top to bottom — torn from God's side, not man's. The way in was opened by the One shut out."},{"cat":"Passion Narratives","level":"beginner","q":"Who asked Pilate for Jesus' body?","choices":["Simon of Cyrene","Joseph of Arimathea","Nicodemus","Peter"],"answer":1,"ref":"John 19:38","note":"A member of the council who had kept his discipleship secret. The cross made a coward brave."},{"cat":"Passion Narratives","level":"intermediate","q":"During what hours did darkness cover the land?","choices":["The sixth hour to the ninth hour","Dawn to noon","Sunset to midnight","The third hour to the sixth"],"answer":0,"ref":"Luke 23:44","note":"Noon to three. The prophets called the day of the LORD a day of darkness — and it landed on Him."},{"cat":"Passion Narratives","level":"beginner","q":"What flowed from Jesus' side when the soldier pierced Him?","choices":["Water only","Blood and water","Blood only","Nothing"],"answer":1,"ref":"John 19:34","note":"John insists on this detail because he saw it. It is medical evidence of real death — and a fountain image the church never forgot."},{"cat":"Passion Narratives","level":"beginner","q":"Who was released to the crowd instead of Jesus?","choices":["Theudas","Judas of Galilee","Barabbas","Simon the Zealot"],"answer":2,"ref":"Mark 15:15","note":"A murderer walks free and an innocent man takes his cross. Barabbas is the first person to see substitution with his own eyes."},{"cat":"Passion Narratives","level":"intermediate","q":"To whom did Jesus entrust His mother from the cross?","choices":["Joseph of Arimathea","James, His brother","Peter","The disciple whom He loved"],"answer":3,"ref":"John 19:26–27","note":"Dying, He was still a son. Redemption never made Him careless with the ordinary duties of love."},{"cat":"Theology of the Cross","level":"expert","q":"Which Old Testament law does Paul cite to say Christ became a curse for us?","choices":["Exodus 12:13","Leviticus 16:8","Deuteronomy 21:23","Numbers 21:9"],"answer":2,"ref":"Galatians 3:13","note":"'Cursed is everyone hanged on a tree.' Paul turns the most shameful text about the cross into the hinge of the gospel."},{"cat":"Theology of the Cross","level":"beginner","q":"Which prophet wrote that the servant was 'pierced for our transgressions'?","choices":["Jeremiah","Zechariah","Isaiah","Ezekiel"],"answer":2,"ref":"Isaiah 53:5","note":"Written centuries before Rome existed. The mechanism was future; the meaning was already revealed."},{"cat":"Theology of the Cross","level":"intermediate","q":"What is the theological term for Christ bearing the penalty in the sinner's place?","choices":["Sanctification","Substitutionary atonement","Adoption","Justification"],"answer":1,"ref":"2 Corinthians 5:21","note":"He became sin who knew no sin, so that we might become the righteousness of God in Him. An exchange, not a rescue."},{"cat":"Theology of the Cross","level":"expert","q":"What Greek word does Paul use in Romans 3:25 for Christ as the sacrifice that turns away wrath?","choices":["Kenōsis","Hilastērion","Agapē","Koinōnia"],"answer":1,"ref":"Romans 3:25","note":"The same word used for the mercy seat in the Greek Old Testament. The place where blood met the Law is now a Person."},{"cat":"Theology of the Cross","level":"intermediate","q":"According to Colossians, what did God nail to the cross?","choices":["The names of the elect","The charges of the Sanhedrin","The Law of Moses","The record of debt that stood against us"],"answer":3,"ref":"Colossians 2:14","note":"Rome nailed a charge sheet above His head. God nailed ours to the same wood."},{"cat":"Theology of the Cross","level":"beginner","q":"Which feast frames the timing and meaning of Jesus' death?","choices":["Pentecost","Purim","Passover","Tabernacles"],"answer":2,"ref":"1 Corinthians 5:7","note":"'Christ our Passover lamb has been sacrificed.' The calendar itself was preaching before the church did."},{"cat":"Theology of the Cross","level":"intermediate","q":"Paul told the Corinthians he resolved to know nothing among them except what?","choices":["The whole counsel of God","The law of love","The resurrection of the dead","Jesus Christ and Him crucified"],"answer":3,"ref":"1 Corinthians 2:2","note":"In a city that prized rhetoric, he preached an executed man. The message was the strategy."},{"cat":"Theology of the Cross","level":"intermediate","q":"The word of the cross is folly to those perishing, but what to those being saved?","choices":["A hidden mystery","The wisdom of men","A stumbling block","The power of God"],"answer":3,"ref":"1 Corinthians 1:18","note":"Same message, opposite effect. The cross doesn't argue people into faith; it divides the room."},{"cat":"Theology of the Cross","level":"expert","q":"According to Colossians 2:15, what did Christ do to the rulers and authorities at the cross?","choices":["Disarmed them and triumphed over them","Handed them to the Father","Bound them for a thousand years","Ignored them"],"answer":0,"ref":"Colossians 2:15","note":"Rome staged a public shaming and lost. The cross was a Roman parade that Christ hijacked into His own triumph."},{"cat":"Theology of the Cross","level":"intermediate","q":"Hebrews says Jesus endured the cross and despised its shame for the sake of what?","choices":["The glory of Israel","The vindication of the prophets","The joy set before Him","The obedience of the nations"],"answer":2,"ref":"Hebrews 12:2","note":"Joy carried Him through, not grim duty. That is the pattern held out to every believer who runs the race."},{"cat":"Theology of the Cross","level":"beginner","q":"In Philippians 2, how far does Paul say Christ's obedience went?","choices":["To the edge of despair","To the point of exile","To the tearing of the veil","To death, even death on a cross"],"answer":3,"ref":"Philippians 2:8","note":"Paul adds 'even death on a cross' as if the word death alone were not low enough. There was no floor beneath His descent."},{"cat":"Theology of the Cross","level":"intermediate","q":"What does Paul say is the only thing he will boast in?","choices":["The cross of our Lord Jesus Christ","His sufferings","His apostleship","The churches he planted"],"answer":0,"ref":"Galatians 6:14","note":"A Roman gallows as a boast is an absurdity — unless the man on it was who He said He was."}]},{"id":"two-ways","title":"The Two Ways","subtitle":"Trivia from the Didache and Scripture","cards":[{"cat":"The Didache Itself","level":"intermediate","q":"What does the Greek word 'Didache' mean?","choices":["The Way","The Teaching","The Gathering","The Witness"],"answer":1,"ref":"Didache, title","note":"Short for 'The Teaching of the Twelve Apostles' — a handbook, not a letter."},{"cat":"The Didache Itself","level":"expert","q":"In what year was the Didache rediscovered after centuries lost?","choices":["1873","1611","1922","1947"],"answer":0,"ref":"Historical note","note":"Philotheos Bryennios found it in a Constantinople manuscript. The early church's catechism resurfaced almost by accident."},{"cat":"The Didache Itself","level":"intermediate","q":"To what period do scholars generally date the Didache?","choices":["Late first to mid-second century","Sixth century","Fourth century","Second century BC"],"answer":0,"ref":"Historical note","note":"Possibly overlapping the writing of some New Testament books — which is why it's such a rare window."},{"cat":"The Didache Itself","level":"beginner","q":"Is the Didache part of inspired Scripture?","choices":["Yes, as an appendix to Acts","Only in Ethiopic Bibles","No — it is a historical witness with no canonical authority","Yes, in the Eastern canon"],"answer":2,"ref":"Historical note","note":"Valuable and old is not the same as inspired. Read it the way you'd read a first-century church bulletin — with interest, not submission."},{"cat":"The Didache Itself","level":"intermediate","q":"What was the likely purpose of the 'Two Ways' material?","choices":["A defense against Rome","Liturgy for Easter","Catechism for converts before baptism","Instructions for bishops only"],"answer":2,"ref":"Didache 7:1","note":"'Having first said all these things, baptize.' Ethics came before the water — they wanted converts who knew what they were signing."},{"cat":"The Didache Itself","level":"expert","q":"Which chapters of the Didache contain the Two Ways?","choices":["Chapter 16 only","Chapters 1–6","Chapters 11–15","Chapters 7–10"],"answer":1,"ref":"Didache 1–6","note":"The rest of the document covers baptism, prayer, the Eucharist, traveling teachers, and the last days."},{"cat":"Biblical Roots","level":"intermediate","q":"Which Deuteronomy passage sets life and death before Israel as a choice?","choices":["Deuteronomy 28:1–14","Deuteronomy 30:15–20","Deuteronomy 6:4–9","Deuteronomy 18:15–18"],"answer":1,"ref":"Deuteronomy 30:15–20","note":"'I have set before you life and good, death and evil... therefore choose life.' The Two Ways is Moses' sermon in catechism form."},{"cat":"Biblical Roots","level":"beginner","q":"Which psalm contrasts the way of the righteous with the way of the wicked?","choices":["Psalm 90","Psalm 119","Psalm 1","Psalm 19"],"answer":2,"ref":"Psalm 1","note":"The Psalter opens with a fork in the road. Everything after it is written by someone who has already chosen."},{"cat":"Biblical Roots","level":"intermediate","q":"Which prophet told Jerusalem, 'I set before you the way of life and the way of death'?","choices":["Jeremiah","Isaiah","Amos","Hosea"],"answer":0,"ref":"Jeremiah 21:8","note":"Spoken with Babylon at the gate. The Two Ways is not abstract — it shows up when the stakes are highest."},{"cat":"Biblical Roots","level":"beginner","q":"Which teaching of Jesus most closely parallels the Two Ways?","choices":["The narrow gate and the broad road","The parable of the sower","The vine and the branches","The prodigal son"],"answer":0,"ref":"Matthew 7:13–14","note":"Two gates, two roads, two destinations, two crowds. Jesus was working the same tradition — and sharpening it."},{"cat":"Biblical Roots","level":"beginner","q":"With what two commands does the Way of Life begin?","choices":["Love God who made you, and love your neighbor as yourself","Fear God and keep His commandments","Repent and be baptized","Do justice and love mercy"],"answer":0,"ref":"Didache 1:2","note":"The Didache opens exactly where Jesus said the whole Law hangs. First-century Christians led with love, not doctrine tests."},{"cat":"Biblical Roots","level":"intermediate","q":"In what form does the Didache state the Golden Rule?","choices":["Positively, exactly as in Matthew 7:12","As a question","Negatively — do not do to another what you would not want done to you","It does not include it"],"answer":2,"ref":"Didache 1:2","note":"The negative form was common in Jewish teaching. Jesus' positive version asks for more than restraint — it asks for initiative."},{"cat":"The Way of Life","level":"intermediate","q":"What does the Didache tell believers to do to those who curse them?","choices":["Answer them with silence","Avoid them entirely","Report them to the elders","Bless them, pray for them, and fast for them"],"answer":3,"ref":"Didache 1:3","note":"Fasting for your enemy is a step past forgiving him. The early church took the Sermon on the Mount as a schedule, not a sentiment."},{"cat":"The Way of Life","level":"expert","q":"How does the Didache's moral instruction repeatedly address the reader?","choices":["'Servant of the Lord'","'My child'","'Beloved'","'Brother'"],"answer":1,"ref":"Didache 3:1","note":"The tone is parental, not bureaucratic. It reads like Proverbs — an older believer walking a younger one through the doorway."},{"cat":"The Way of Life","level":"expert","q":"According to the Didache, what does grumbling lead to?","choices":["Division","Idolatry","Theft","Blasphemy"],"answer":3,"ref":"Didache 3:6","note":"The logic is that complaint is an accusation against God's providence. Small sins are treated as seedlings, not trivia."},{"cat":"The Way of Life","level":"expert","q":"The Didache warns against being the kind of person who does what with his hands?","choices":["Idles them in laziness","Uses them for violence","Raises them in false worship","Stretches them out to receive but draws them back from giving"],"answer":3,"ref":"Didache 4:5","note":"One of the sharpest lines in the document. Generosity is measured at the moment of release, not the moment of intention."},{"cat":"The Way of Life","level":"intermediate","q":"How does the Didache tell believers to treat the one who speaks God's word to them?","choices":["Test him with three questions","Support him financially for two years","Submit to him without question","Remember him night and day and honor him as the Lord"],"answer":3,"ref":"Didache 4:1","note":"'For where the lordship is spoken of, there is the Lord.' Honor for the messenger flows from reverence for the message."},{"cat":"The Way of Life","level":"intermediate","q":"What does the Didache say about anger?","choices":["It is permitted if righteous","It should be confessed weekly","It leads to murder, so flee it","It is unavoidable"],"answer":2,"ref":"Didache 3:2","note":"Same move Jesus makes in Matthew 5 — trace the act back to the affection that births it, and kill it there."},{"cat":"The Way of Death","level":"intermediate","q":"How does the Didache describe the Way of Death?","choices":["Wide and pleasant","Hidden and subtle","Ancient and honored","Evil and full of cursing"],"answer":3,"ref":"Didache 5:1","note":"No nuance offered. The document assumes its readers can already feel the pull and doesn't flatter them about it."},{"cat":"The Way of Death","level":"expert","q":"What heads the Didache's catalog of the Way of Death?","choices":["Idleness and gossip","Murders, adulteries, lusts, and thefts","Doubt and unbelief","Pride and envy"],"answer":1,"ref":"Didache 5:1","note":"The list moves from the shocking to the ordinary — and the ordinary sins take up more space than the shocking ones."},{"cat":"The Way of Death","level":"expert","q":"Which group does the Didache single out as those who do not pity the poor?","choices":["The wealthy alone","False prophets","Roman officials","Those who turn away the needy and oppress the afflicted"],"answer":3,"ref":"Didache 5:2","note":"Neglect of the poor sits in the same catalog as murder. The early church saw indifference as an active direction of travel."},{"cat":"The Way of Death","level":"expert","q":"What does the Didache say about bearing the whole yoke of the Lord?","choices":["It is impossible for anyone","It is required of all believers","If you can bear it you will be perfect; if not, do what you can","It applies only to teachers"],"answer":2,"ref":"Didache 6:2","note":"A pastoral realism worth noticing. The standard doesn't move, but the document refuses to crush the weak with it."},{"cat":"The Way of Death","level":"intermediate","q":"What specific food warning closes the Two Ways section?","choices":["Abstain from food offered to idols","Fast twice a week","Avoid meat with blood in it","Eat only what is set before you"],"answer":0,"ref":"Didache 6:3","note":"'For it is the worship of dead gods.' The one dietary line is about allegiance, not nutrition."},{"cat":"The Way of Death","level":"beginner","q":"What is the fundamental claim of the Two Ways?","choices":["The way is revealed only to the mature","There are two roads and every person is walking one of them","The choice is made once at baptism","Most people are somewhere in the middle"],"answer":1,"ref":"Didache 1:1","note":"'There are two ways, one of life and one of death, and there is a great difference between the two.' No third road is offered."}]},{"id":"resting-in-god","title":"Resting in God","subtitle":"Trading striving for trust","cards":[{"cat":"Scripture","level":"beginner","q":"Where does the Bible first describe God resting?","choices":["Genesis 2:1–3","Hebrews 4","Psalm 95","Exodus 20:8–11"],"answer":0,"ref":"Genesis 2:1–3","note":"Rest is written into creation before it is written into law. It's the pattern of the world, not a rule added later."},{"cat":"Scripture","level":"beginner","q":"Complete Jesus' invitation: 'Come to me, all who labor and are heavy laden, and I will…'","choices":["carry your burden","teach you the way","lighten your load","give you rest"],"answer":3,"ref":"Matthew 11:28","note":"He does not say 'and I will give you a break.' The gift is rest itself — a settled soul, not a pause in the schedule."},{"cat":"Scripture","level":"beginner","q":"How does Jesus describe His yoke and burden?","choices":["My yoke is heavy but my burden is short","My yoke is easy and my burden is light","My yoke is narrow and my burden is holy","My yoke is shared and my burden is joy"],"answer":1,"ref":"Matthew 11:30","note":"A yoke is still work. He doesn't offer no yoke — He offers a better one, and He's already in it beside you."},{"cat":"Scripture","level":"intermediate","q":"What did God promise Moses in Exodus 33:14?","choices":["My presence will go with you, and I will give you rest","I will hide you in the cleft of the rock","The land will have rest from war","I will send an angel before you"],"answer":0,"ref":"Exodus 33:14","note":"Moses had asked for direction. God gave him company. Rest is not an outcome God delivers — it's His presence arriving."},{"cat":"Scripture","level":"beginner","q":"In Psalm 23, what does the shepherd make the sheep do?","choices":["Climb to high places","Lie down in green pastures","Stand in the valley","Run to still waters"],"answer":1,"ref":"Psalm 23:2","note":"'Makes me' — the verb is gentle force. Some of us won't lie down until we're led there."},{"cat":"Scripture","level":"intermediate","q":"What did God swear in Psalm 95 concerning the wilderness generation?","choices":["They shall wander forty years","They shall not enter my rest","They shall not see the land","Their children shall bear their sin"],"answer":1,"ref":"Psalm 95:11","note":"The most sobering sentence in the Bible about rest. It's possible to be delivered from Egypt and still miss the rest."},{"cat":"Scripture","level":"intermediate","q":"What does Hebrews 4:9 declare?","choices":["Rest is only for the age to come","The rest was fulfilled under Joshua","There remains a Sabbath rest for the people of God","The Sabbath is abolished in Christ"],"answer":2,"ref":"Hebrews 4:9","note":"'Remains' is the key word. Canaan wasn't it. The promise is still open — which means it can still be entered, or missed."},{"cat":"Scripture","level":"intermediate","q":"According to Hebrews, why could the wilderness generation not enter God's rest?","choices":["Because of Moses' sin","Because they built the calf","Because the giants were too strong","Because of unbelief"],"answer":3,"ref":"Hebrews 3:19","note":"Not laziness. Unbelief. Restlessness is a faith problem wearing a productivity costume."},{"cat":"Key Terms","level":"intermediate","q":"What is the Hebrew word for Sabbath, and what does it mean?","choices":["Shabbat — to cease, to stop","Nuach — to settle","Menuchah — resting place","Shalom — peace"],"answer":0,"ref":"Genesis 2:2","note":"Not 'to relax.' To stop. The first rest in Scripture was not recovery from exhaustion — God wasn't tired. It was completion."},{"cat":"Key Terms","level":"beginner","q":"Which Hebrew word means wholeness, completeness, and peace?","choices":["Kavod","Shabbat","Shalom","Chesed"],"answer":2,"ref":"Numbers 6:26","note":"Far bigger than 'no conflict.' Shalom is everything in its right place — which is why it can only come from the One who set the places."},{"cat":"Key Terms","level":"expert","q":"Which Greek verb does Jesus use for 'I will give you rest'?","choices":["Katapausis","Hēsuchia","Anapauō","Eirēnē"],"answer":2,"ref":"Matthew 11:28","note":"A refreshing — the word used for giving a laborer relief. Jesus is offering the soul what a night's sleep offers the body."},{"cat":"Key Terms","level":"expert","q":"Which Greek noun does Hebrews use for God's rest as a place to be entered?","choices":["Anapausis","Paraklēsis","Sabbatismos","Katapausis"],"answer":3,"ref":"Hebrews 4:3","note":"A location, not a mood. You enter it. Which means there's a threshold — and a way to stand outside it."},{"cat":"Key Terms","level":"expert","q":"What rare word does Hebrews 4:9 use for 'Sabbath rest'?","choices":["Sabbatismos","Anapauō","Katapausis","Shabbat"],"answer":0,"ref":"Hebrews 4:9","note":"A Sabbath-keeping. The author coins a term because no existing word carried both the weekly rhythm and the eternal reality."},{"cat":"Key Terms","level":"expert","q":"What does the Hebrew verb 'nuach' mean?","choices":["To sing","To labor","To settle down, to come to rest","To wander"],"answer":2,"ref":"Genesis 8:4","note":"The ark 'rested' on Ararat. Noah's name comes from the same root — rest arrives when the waters recede and there's ground again."},{"cat":"Key Terms","level":"expert","q":"What does 'menuchah' refer to in Psalm 23:2?","choices":["Rushing streams","Waters of rest — a place of quiet","Pools of cleansing","Wells of salvation"],"answer":1,"ref":"Psalm 23:2","note":"Sheep won't drink from fast water. The shepherd's job is finding still places — the rest is the point of the leading."},{"cat":"Theology","level":"intermediate","q":"Exodus 20 grounds the Sabbath command in what?","choices":["The exodus from Egypt","The promise to Abraham","The covenant at Sinai","Creation — God rested on the seventh day"],"answer":3,"ref":"Exodus 20:11","note":"Two tellings, two reasons. Exodus roots rest in creation; Deuteronomy roots it in rescue. Both are true of yours."},{"cat":"Theology","level":"intermediate","q":"Deuteronomy 5 grounds the same command in what?","choices":["Creation in six days","Redemption — you were a slave in Egypt","The Levites' service","The manna in the wilderness"],"answer":1,"ref":"Deuteronomy 5:15","note":"Slaves don't get days off. Every Sabbath was a re-enactment of freedom — and a refusal to go back."},{"cat":"Theology","level":"intermediate","q":"What does Paul call the Sabbath in Colossians 2?","choices":["A shadow of things to come, whose substance is Christ","The seal of the covenant","A matter of conscience only","A yoke of bondage"],"answer":0,"ref":"Colossians 2:16–17","note":"You don't argue with a shadow — you follow it to the body casting it. The day was always pointing at a Person."},{"cat":"Theology","level":"beginner","q":"Who did Jesus say is Lord of the Sabbath?","choices":["Every believer","The high priest","Moses","The Son of Man"],"answer":3,"ref":"Mark 2:28","note":"The claim is enormous. He isn't reinterpreting the day — He's saying it was always His."},{"cat":"Theology","level":"beginner","q":"Complete Jesus' statement: 'The Sabbath was made for man, not…'","choices":["the Sabbath for God","man for the law","man for the Sabbath","man for the temple"],"answer":2,"ref":"Mark 2:27","note":"A gift had been turned into a test. Jesus puts it back in the right direction — rest serves you, you don't serve it."},{"cat":"Theology","level":"intermediate","q":"According to Hebrews 4:10, what does the one who enters God's rest do?","choices":["Labors twice as hard","Rests from his own works, as God did from His","Waits for the age to come","Keeps the seventh day strictly"],"answer":1,"ref":"Hebrews 4:10","note":"Salvation rest means the striving to be accepted is over. Not the work — the striving."},{"cat":"Theology","level":"intermediate","q":"What rest does Revelation 14:13 promise?","choices":["A thousand years of peace","Rest from doubt","Rest from persecution on earth","Rest from their labors, with their deeds following them"],"answer":3,"ref":"Revelation 14:13","note":"The labors stop; the fruit doesn't. Nothing done in faith gets left behind at the door."},{"cat":"Practice","level":"intermediate","q":"What surprising command does Hebrews 4:11 give about rest?","choices":["Wait quietly for that rest","Guard that rest carefully","Teach others that rest","Strive to enter that rest"],"answer":3,"ref":"Hebrews 4:11","note":"The one paradox at the center of the whole theme. Entering rest takes effort — because unbelief never rests."},{"cat":"Practice","level":"beginner","q":"What did Jesus habitually withdraw to desolate places to do?","choices":["Pray","Fast","Sleep","Teach the twelve"],"answer":0,"ref":"Luke 5:16","note":"'But He would withdraw' — the Greek is a habit, not an event. The busiest ministry in history had a retreat rhythm."},{"cat":"Practice","level":"intermediate","q":"How did God first minister to Elijah under the broom tree?","choices":["He sent fire","He gave him a new commission","He let him sleep, then fed him","He rebuked him"],"answer":2,"ref":"1 Kings 19:5–8","note":"Before the still small voice came a nap and a meal. Sometimes the most spiritual thing available is rest and bread."},{"cat":"Practice","level":"beginner","q":"What did Jesus tell Martha was necessary?","choices":["One thing — and Mary had chosen it","Balance between work and worship","Hospitality above all","That her sister help her"],"answer":0,"ref":"Luke 10:41–42","note":"Martha wasn't wrong to serve; she was wrong to be anxious and troubled about many things. Rest is what she was missing, not a chore chart."},{"cat":"Practice","level":"intermediate","q":"What does Psalm 127:2 say God gives to His beloved?","choices":["Bread","Children","Sleep","Length of days"],"answer":2,"ref":"Psalm 127:2","note":"'It is in vain that you rise up early and go late to rest.' Anxious productivity is called vanity by name."},{"cat":"Practice","level":"expert","q":"According to Isaiah 30:15, in what shall you be saved?","choices":["In fasting and prayer","In returning and rest","In watching and waiting","In strength and courage"],"answer":1,"ref":"Isaiah 30:15","note":"The verse ends devastatingly: 'but you were unwilling.' Rest was offered and declined. It usually is."}]},{"id":"sovereign-hand","title":"God's Sovereign Hand","subtitle":"Five figures — restrained, willing, resistant, proud, unwitting","cards":[{"cat":"Abimelech","level":"intermediate","q":"Who was Abimelech in Genesis 20?","choices":["King of Sodom","King of Gerar","Pharaoh of Egypt","A priest of Midian"],"answer":1,"ref":"Genesis 20:2","note":"A pagan king who behaves better than the patriarch in the story. Scripture is unembarrassed about that."},{"cat":"Abimelech","level":"beginner","q":"What did Abraham say Sarah was?","choices":["A widow under his care","His servant","His sister","His cousin"],"answer":2,"ref":"Genesis 20:2","note":"The same lie he told in Egypt. Repentance is real, but old fears have long memories."},{"cat":"Abimelech","level":"intermediate","q":"How did God confront Abimelech?","choices":["By a plague on Gerar","Through Abraham directly","Through the angel of the LORD","In a dream by night"],"answer":3,"ref":"Genesis 20:3","note":"God speaks to a man outside the covenant, in his sleep, before any harm is done. Sovereignty doesn't wait for an invitation."},{"cat":"Abimelech","level":"intermediate","q":"What did God tell Abimelech he was?","choices":["A servant of the Most High","Guilty of great sin","A dead man, because of the woman he had taken","A friend of Abraham"],"answer":2,"ref":"Genesis 20:3","note":"Blunt. But notice the mercy in it — God announces the sentence before the crime is complete."},{"cat":"Abimelech","level":"intermediate","q":"What did God say He Himself had done for Abimelech?","choices":["I kept you from sinning against me","I sent my angel before you","I hid the truth from you","I hardened your heart"],"answer":0,"ref":"Genesis 20:6","note":"This is the whole point of the week. God restrained a man from a sin he fully intended to commit — and Abimelech never knew until told."},{"cat":"Abimelech","level":"intermediate","q":"What title does God give Abraham when speaking to Abimelech?","choices":["My friend","A wanderer","A prophet","A father of nations"],"answer":2,"ref":"Genesis 20:7","note":"The first use of the word 'prophet' in the Bible — applied to a man in the middle of a lie. Grace is stubborn."},{"cat":"Abimelech","level":"intermediate","q":"What happened after Abraham prayed for Abimelech?","choices":["God healed Abimelech, his wife, and his female slaves","Abraham was driven out","Fire fell on Gerar","Abimelech converted"],"answer":0,"ref":"Genesis 20:17","note":"The liar intercedes for the man he wronged, and it works. God's purposes don't wait for our character to catch up."},{"cat":"Abimelech","level":"expert","q":"What aspect of sovereignty does Abimelech's story display?","choices":["Sovereignty that calls by name","Sovereignty that overrides hostility","Sovereignty that restrains","Sovereignty that humbles"],"answer":2,"ref":"Theme — Week 1","note":"Some of God's greatest work in your life is the sin He stopped you from committing. You will never see the list."},{"cat":"Deborah","level":"beginner","q":"What two offices did Deborah hold?","choices":["Prophetess and judge","Prophetess and mother of Barak","Priestess and queen","Judge and warrior"],"answer":0,"ref":"Judges 4:4","note":"The only judge in the book who is already judging Israel before the crisis begins. She wasn't raised up by war — she was found in place."},{"cat":"Deborah","level":"intermediate","q":"Where did Deborah hold court?","choices":["On Mount Tabor","In Hazor","At the gate of Shiloh","Under the palm of Deborah, between Ramah and Bethel"],"answer":3,"ref":"Judges 4:5","note":"A tree, not a throne room. The people came up to her — the text says so plainly."},{"cat":"Deborah","level":"beginner","q":"Whom did Deborah summon to lead Israel's army?","choices":["Barak son of Abinoam","Gideon","Othniel","Jael's husband Heber"],"answer":0,"ref":"Judges 4:6","note":"She doesn't give him a suggestion. She asks whether the LORD has not already commanded him — the word had come and stalled."},{"cat":"Deborah","level":"intermediate","q":"What condition did Barak place on going to battle?","choices":["If the LORD sends fire, I will go","If you go with me, I will go; if not, I will not go","If you give me a sign","If the tribes assemble, I will go"],"answer":1,"ref":"Judges 4:8","note":"Not cowardice exactly — he wanted the prophetic voice present. But faith that needs a chaperone still forfeits something."},{"cat":"Deborah","level":"intermediate","q":"What did Deborah say the consequence of Barak's condition would be?","choices":["The glory would go to a woman","He would not see the victory","Israel would lose a tribe","The battle would be delayed"],"answer":0,"ref":"Judges 4:9","note":"God's plan doesn't fail — it just reroutes the honor. Sovereignty is never blocked by our hesitation, only redistributed."},{"cat":"Deborah","level":"beginner","q":"Who killed Sisera, and how?","choices":["Barak, with a sword","He drowned in the Kishon","Deborah, with a stone","Jael, with a tent peg through his temple"],"answer":3,"ref":"Judges 4:21","note":"A domestic tool in a domestic tent. The general of nine hundred iron chariots is undone by hospitality and a hammer."},{"cat":"Deborah","level":"intermediate","q":"What does Deborah call herself in her song?","choices":["The LORD's servant","A mother in Israel","A daughter of Ephraim","A sword of the LORD"],"answer":1,"ref":"Judges 5:7","note":"Not 'a general in Israel.' She defines her leadership by care, not command — and the nation had rest forty years."},{"cat":"Deborah","level":"expert","q":"What aspect of sovereignty does Deborah's story display?","choices":["Sovereignty willingly embraced","Sovereignty that humbles","Sovereignty over the unwitting","Sovereignty that restrains"],"answer":0,"ref":"Theme — Week 2","note":"God is not looking for the most obvious instrument. He's looking for a willing one — and He'll bypass the reluctant to find her."},{"cat":"Balaam","level":"intermediate","q":"Who hired Balaam, and for what?","choices":["Balak of Moab, to curse Israel","Sihon of Heshbon, to bless Moab","Og of Bashan, to prophesy war","The elders of Midian, to divine the future"],"answer":0,"ref":"Numbers 22:5–6","note":"Balak's theology is transactional — he assumes blessing and cursing are for sale. Much religion still runs on that assumption."},{"cat":"Balaam","level":"intermediate","q":"What blocked Balaam's path on the road?","choices":["Moabite soldiers","A landslide","The angel of the LORD with a drawn sword","A pillar of fire"],"answer":2,"ref":"Numbers 22:23","note":"The professional seer can't see. The donkey can. The irony is doing theological work."},{"cat":"Balaam","level":"beginner","q":"What spoke to Balaam and rebuked him?","choices":["His donkey","A voice from heaven","The angel","Balak's messengers"],"answer":0,"ref":"Numbers 22:28","note":"God will use any mouth He chooses. If the prophet won't speak truth, the animal will."},{"cat":"Balaam","level":"beginner","q":"What came out of Balaam's mouth instead of a curse?","choices":["Silence","A lament","A riddle","Blessing"],"answer":3,"ref":"Numbers 23:11","note":"He was paid to curse and physically could not. Sovereignty here is not persuasion — it's override."},{"cat":"Balaam","level":"intermediate","q":"How many times did Balak try to get Israel cursed?","choices":["Once","Three","Two","Seven"],"answer":1,"ref":"Numbers 23–24","note":"New altars, new mountain, same result. You cannot relocate your way around the will of God."},{"cat":"Balaam","level":"intermediate","q":"What rhetorical question did Balaam ask about cursing Israel?","choices":["Has God not spoken already?","How can I curse whom God has not cursed?","Shall I sell my tongue for silver?","Who am I to speak for the LORD?"],"answer":1,"ref":"Numbers 23:8","note":"He understood the problem exactly. Understanding it and submitting to it turned out to be different things."},{"cat":"Balaam","level":"expert","q":"How does the New Testament remember Balaam?","choices":["It does not mention him","As one who loved the wages of unrighteousness","As a faithful prophet to the nations","As a martyr"],"answer":1,"ref":"2 Peter 2:15","note":"He said the right words and wanted the wrong thing. God used him and still judged him — being useful is not the same as being righteous."},{"cat":"Balaam","level":"expert","q":"What aspect of sovereignty does Balaam's story display?","choices":["Sovereignty overriding hostile intent","Sovereignty willingly embraced","Sovereignty that humbles pride","Sovereignty that restrains"],"answer":0,"ref":"Theme — Week 3","note":"The curse aimed at God's people came back as blessing. Whatever is aimed at you passes through His hands first."},{"cat":"Nebuchadnezzar","level":"beginner","q":"What empire did Nebuchadnezzar rule?","choices":["Persia","Assyria","Babylon","Egypt"],"answer":2,"ref":"Daniel 1–4","note":"The superpower that burned the temple. And God calls him something you would not expect."},{"cat":"Nebuchadnezzar","level":"expert","q":"What title does God give Nebuchadnezzar in Jeremiah?","choices":["The rod of my anger","My servant","The destroyer","The beast from the north"],"answer":1,"ref":"Jeremiah 25:9","note":"The man who leveled Jerusalem is called God's servant. Sovereignty is not squeamish about its instruments."},{"cat":"Nebuchadnezzar","level":"intermediate","q":"What did the dream of the great statue in Daniel 2 reveal?","choices":["That Babylon would last forever","That Persia would fall to Greece","That the temple would be rebuilt","That God alone sets up and removes kingdoms"],"answer":3,"ref":"Daniel 2","note":"The king dreams of empires and a stone cut without hands crushes the lot. Even his subconscious was preaching to him."},{"cat":"Nebuchadnezzar","level":"intermediate","q":"What vision warned Nebuchadnezzar of his coming humiliation?","choices":["A hand writing on a wall","A great tree cut down","Four beasts from the sea","A statue of gold"],"answer":1,"ref":"Daniel 4:10–17","note":"Daniel begged him to break off his sins. He got twelve months of grace before the word landed."},{"cat":"Nebuchadnezzar","level":"intermediate","q":"How long did Nebuchadnezzar's humbling last?","choices":["Forty days","Three years","Seven periods of time","One year"],"answer":2,"ref":"Daniel 4:16","note":"Commonly read as seven years. Long enough that the empire kept his throne for him — God's discipline is precise, not chaotic."},{"cat":"Nebuchadnezzar","level":"beginner","q":"What happened to Nebuchadnezzar during his humbling?","choices":["He went blind","He was imprisoned by his own generals","He was exiled to Susa","He lived like an animal and ate grass like an ox"],"answer":3,"ref":"Daniel 4:33","note":"The man who said 'is not this great Babylon which I have built' ended up grazing in it. Pride is answered in kind."},{"cat":"Nebuchadnezzar","level":"intermediate","q":"What did Nebuchadnezzar confess when his reason returned?","choices":["That Daniel's God is one god among many","That Babylon would fall","That he had been deceived","Those who walk in pride He is able to humble"],"answer":3,"ref":"Daniel 4:37","note":"The last words we have from him are worship. Sometimes the field is the only classroom that works."},{"cat":"Nebuchadnezzar","level":"expert","q":"What aspect of sovereignty does Nebuchadnezzar's story display?","choices":["Sovereignty that restrains","Sovereignty willingly embraced","Sovereignty over the unwitting","Sovereignty that humbles pride"],"answer":3,"ref":"Theme — Week 4","note":"God used his ambition, then broke it, then received his praise. All three were sovereignty."},{"cat":"Cyrus","level":"beginner","q":"What empire did Cyrus rule?","choices":["Babylon","Persia","Media alone","Assyria"],"answer":1,"ref":"Isaiah 44–45","note":"The empire that succeeded Babylon — and God had his name on file before either was in power."},{"cat":"Cyrus","level":"expert","q":"Roughly how long before Cyrus's birth does Isaiah name him?","choices":["In the same decade","Three generations after the exile","About ten years","Over a century"],"answer":3,"ref":"Isaiah 44:28–45:1","note":"Named before he existed, for a job he'd do for a God he didn't know. That's the whole week in one sentence."},{"cat":"Cyrus","level":"intermediate","q":"What pastoral title does God give Cyrus?","choices":["My son","My chosen","My shepherd","My servant"],"answer":2,"ref":"Isaiah 44:28","note":"A title used for David — and for the Lord Himself in Psalm 23 — handed to a Persian polytheist."},{"cat":"Cyrus","level":"expert","q":"What royal title does God also give Cyrus?","choices":["The LORD's brother","King of kings","Prince of peace","His anointed"],"answer":3,"ref":"Isaiah 45:1","note":"The Hebrew is 'his messiah.' The word reserved for kings and priests of Israel is spoken over a foreign emperor."},{"cat":"Cyrus","level":"intermediate","q":"What task did God say Cyrus would accomplish?","choices":["Convert to the God of Israel","Rebuild Jerusalem and lay the temple's foundation","Restore the ark","Destroy Egypt"],"answer":1,"ref":"Isaiah 44:28","note":"A policy decision in Persia was written down in Judah a hundred and fifty years earlier."},{"cat":"Cyrus","level":"intermediate","q":"What striking phrase does God repeat about Cyrus's relationship to Him?","choices":["Though you were far off","Though you rebel against me","Though you do not know me","Though the nations rage"],"answer":2,"ref":"Isaiah 45:4–5","note":"Twice. God is emphatic that Cyrus's ignorance changes nothing about God's use of him."},{"cat":"Cyrus","level":"intermediate","q":"Which book records Cyrus's decree releasing the exiles?","choices":["Nehemiah","Esther","Ezra","Daniel"],"answer":2,"ref":"Ezra 1:1–4","note":"'The LORD stirred up the spirit of Cyrus.' The emperor thought it was his idea. It was in the file."},{"cat":"Cyrus","level":"expert","q":"What aspect of sovereignty does Cyrus's story display?","choices":["Sovereignty over those who never knew Him","Sovereignty that restrains","Sovereignty that humbles pride","Sovereignty willingly embraced"],"answer":0,"ref":"Theme — Week 5","note":"The arc closes here: restrained, willing, resistant, proud, unwitting. None of it depended on anyone believing in Him."}]},{"id":"altar-of-witness","title":"The Altar of Witness","subtitle":"Joshua 22 — zeal, confrontation, and reconciliation","cards":[{"cat":"A Shocking Report","level":"intermediate","q":"Which tribes returned east across the Jordan?","choices":["Judah, Simeon, and Benjamin","Reuben, Gad, and the half-tribe of Manasseh","Dan, Asher, and Naphtali","Ephraim and Manasseh"],"answer":1,"ref":"Joshua 22:9","note":"They had fought for seven years for land they wouldn't live on. Joshua sends them home commended — and then it all goes wrong."},{"cat":"A Shocking Report","level":"beginner","q":"What did the eastern tribes build at the Jordan?","choices":["A gate and watchtower","An altar of imposing size","A stone memorial with no altar","A city of refuge"],"answer":1,"ref":"Joshua 22:10","note":"The text stresses its size. Whatever it was for, it was meant to be seen — and it was."},{"cat":"A Shocking Report","level":"intermediate","q":"What did the rest of Israel gather at Shiloh to do?","choices":["Consult the Urim and Thummim","Send a letter of inquiry","Tear down the altar by night","Make war against them"],"answer":3,"ref":"Joshua 22:12","note":"The whole assembly mobilizes for civil war on the basis of a report. No one has asked a single question yet."},{"cat":"A Shocking Report","level":"intermediate","q":"Whom did Israel send to the eastern tribes first?","choices":["Phinehas son of Eleazar the priest","Caleb","Eleazar the high priest","Joshua himself"],"answer":0,"ref":"Joshua 22:13","note":"The one man in Israel with a documented record of killing over idolatry. The delegation is a warning in itself."},{"cat":"A Shocking Report","level":"expert","q":"How many chiefs accompanied Phinehas?","choices":["Seven","Three","Ten — one from each tribal family","Twelve"],"answer":2,"ref":"Joshua 22:14","note":"One per western tribe. Whatever else Israel got wrong here, they went in person and they went representatively."},{"cat":"A Shocking Report","level":"intermediate","q":"What is the first thing Israel does right in this story?","choices":["They cast lots","They fast for three days","They talk before they fight","They wait for Joshua's word"],"answer":2,"ref":"Joshua 22:13–15","note":"Barely. The army is already assembled. But the delegation goes first — and that decision saves a nation."},{"cat":"A Shocking Report","level":"intermediate","q":"What was the assumed offense of the altar?","choices":["Rival worship — a second place of sacrifice","Building without Joshua's permission","Trespass on tribal land","Idol worship of Baal"],"answer":0,"ref":"Deuteronomy 12:5–14","note":"The Law commanded one place of sacrifice. Their alarm was theologically literate. It was also completely wrong about the facts."},{"cat":"A Shocking Report","level":"expert","q":"What is the lesson of Joshua 22:10–15?","choices":["Zeal without investigation","Compromise with sin","The danger of geography","The cost of silence"],"answer":0,"ref":"Theme — Week 1","note":"They were right to care and nearly catastrophic in how they acted on it. Passion for God's honor is not a substitute for asking."},{"cat":"Zeal and Memory","level":"intermediate","q":"What did the delegation accuse the eastern tribes of?","choices":["Cowardice in battle","Theft of plunder","Breaking faith with the God of Israel by rebelling","Abandoning their inheritance"],"answer":2,"ref":"Joshua 22:16","note":"'What is this breach of faith?' They open with the charge, not the question. It's how most confrontations go."},{"cat":"Zeal and Memory","level":"expert","q":"Which past sin does Phinehas recall?","choices":["The golden calf","The spies' report at Kadesh","The rebellion of Korah","The sin at Peor"],"answer":3,"ref":"Joshua 22:17","note":"Phinehas was there. He drove the spear. His memory of what idolatry costs is not theoretical — it's on his hands."},{"cat":"Zeal and Memory","level":"intermediate","q":"Whose sin does the delegation cite as bringing wrath on the whole congregation?","choices":["Achan's","Balaam's","Aaron's","Nadab and Abihu's"],"answer":0,"ref":"Joshua 22:20","note":"One man's hidden greed and thirty-six men die at Ai. Israel had learned that sin is never a private transaction."},{"cat":"Zeal and Memory","level":"intermediate","q":"What did the delegation offer the eastern tribes?","choices":["Amnesty if they tore down the altar","Nothing — only a warning","Land among them on the western side, in the LORD's land","A share in the temple offerings"],"answer":2,"ref":"Joshua 22:19","note":"This is the moment the confrontation turns pastoral. 'Come over to us' — they'd rather give up territory than lose brothers."},{"cat":"Zeal and Memory","level":"intermediate","q":"What principle does Joshua 22:18 state?","choices":["Judgment begins with the house of God","If you rebel today, tomorrow He will be angry with the whole congregation","Each man dies for his own sin","The LORD will not hold the innocent guilty"],"answer":1,"ref":"Joshua 22:18","note":"Corporate accountability. Nobody sins alone, and nobody in a covenant community is only responsible for themselves."},{"cat":"Zeal and Memory","level":"expert","q":"Where is the sin at Peor recorded?","choices":["Judges 2","Leviticus 10","Exodus 32","Numbers 25"],"answer":3,"ref":"Numbers 25","note":"Twenty-four thousand died. Phinehas's zeal stopped the plague — which is exactly why he's the wrong man to send unaccompanied."},{"cat":"Zeal and Memory","level":"intermediate","q":"Where is Achan's sin recorded?","choices":["Joshua 3","Joshua 10","Judges 1","Joshua 7"],"answer":3,"ref":"Joshua 7","note":"A cloak, silver, and a bar of gold under a tent floor. The whole nation stumbled over one man's souvenir."},{"cat":"Zeal and Memory","level":"expert","q":"What is the lesson of Joshua 22:16–20?","choices":["Confrontation done rightly, and corporate accountability","The futility of memory","The peril of tribal land","The limits of priesthood"],"answer":0,"ref":"Theme — Week 2","note":"They came with the charge — but also with an offer and a memory. That combination is what keeps confrontation from becoming war."},{"cat":"The Answer at the Jordan","level":"intermediate","q":"How do the eastern tribes open their reply?","choices":["Brothers, hear us","We have sinned","The Mighty One, God, the LORD! He knows","Far be it from us"],"answer":2,"ref":"Joshua 22:22","note":"Three names for God stacked up, twice. They don't defend themselves first — they invoke the only witness who can settle it."},{"cat":"The Answer at the Jordan","level":"beginner","q":"Was the altar built for sacrifice?","choices":["Yes, for the eastern tribes' priests","Yes, but only in emergencies","Yes, for burnt offerings only","No"],"answer":3,"ref":"Joshua 22:26","note":"Not one offering was ever intended. The nation nearly went to war over a misread symbol."},{"cat":"The Answer at the Jordan","level":"intermediate","q":"What was the altar's actual purpose?","choices":["A witness between us and you and our generations after us","A memorial to the fallen","A place of assembly","A boundary marker"],"answer":0,"ref":"Joshua 22:27","note":"It was a replica, not a rival. Built to prove they belonged, and taken as proof they'd left."},{"cat":"The Answer at the Jordan","level":"intermediate","q":"What fear drove them to build it?","choices":["That the Jordan would flood","That someday your children will say to ours, 'You have no portion in the LORD'","That their land would be taken","That war would return"],"answer":1,"ref":"Joshua 22:24–25","note":"They were not thinking about themselves. They were thinking about grandchildren they'd never meet."},{"cat":"The Answer at the Jordan","level":"beginner","q":"What geographical feature did they fear would divide the nation?","choices":["The Dead Sea","The Jezreel Valley","The Jordan","The wilderness of Zin"],"answer":2,"ref":"Joshua 22:25","note":"'The LORD has made the Jordan a boundary.' A river can become a theology if nobody builds against it."},{"cat":"The Answer at the Jordan","level":"intermediate","q":"What phrase do they repeat about rebellion?","choices":["Far be it from us that we should rebel against the LORD","The LORD forbid it","We are not such men","Let the LORD judge"],"answer":0,"ref":"Joshua 22:29","note":"Repeated twice in the speech. The accusation horrified them more than the army did."},{"cat":"The Answer at the Jordan","level":"intermediate","q":"What did they call the only legitimate altar?","choices":["The bronze altar of Moses","The altar of the LORD our God that stands before His tabernacle","The altar of Ebal","The altar of Shiloh"],"answer":1,"ref":"Joshua 22:29","note":"They knew the Law better than their accusers assumed. Sometimes the person you're confronting has thought about this longer than you have."},{"cat":"The Answer at the Jordan","level":"expert","q":"What is the lesson of Joshua 22:21–29?","choices":["The importance of borders","The need for written records","The failure of priesthood","A clear conscience, and guarding the next generation's inheritance"],"answer":3,"ref":"Theme — Week 3","note":"They built a monument against a conversation that hadn't happened yet. That's not paranoia — that's love with a long memory."},{"cat":"Ed — The Witness","level":"intermediate","q":"How did Phinehas respond to their answer?","choices":["He demanded the altar be torn down","He withheld judgment","It was good in his eyes — he was pleased","He wept"],"answer":2,"ref":"Joshua 22:30","note":"The man sent to judge accepts the explanation immediately. Zeal that can hear is zeal worth having."},{"cat":"Ed — The Witness","level":"intermediate","q":"What did Phinehas conclude?","choices":["Let this never be spoken of","You have escaped judgment","The LORD has been merciful","Today we know that the LORD is in our midst"],"answer":3,"ref":"Joshua 22:31","note":"He reads their innocence as evidence of God's presence. Faithfulness in your brothers is proof God is among you."},{"cat":"Ed — The Witness","level":"intermediate","q":"What did the people do instead of going to war?","choices":["They demanded hostages","They blessed God","They rebuilt the altar together","They dispersed quietly"],"answer":1,"ref":"Joshua 22:33","note":"The report that nearly started a war ends in worship. That's the whole arc in one verse."},{"cat":"Ed — The Witness","level":"intermediate","q":"What name was given to the altar?","choices":["Ebenezer","Bethel","Galeed","Ed"],"answer":3,"ref":"Joshua 22:34","note":"One syllable. They named it after the argument, so nobody would have to have it twice."},{"cat":"Ed — The Witness","level":"beginner","q":"What does 'Ed' mean?","choices":["Boundary","Remembrance","Witness","Peace"],"answer":2,"ref":"Joshua 22:34","note":"Not 'Victory.' Not 'Reconciliation.' Witness — because the point was never the altar. It was the testimony."},{"cat":"Ed — The Witness","level":"intermediate","q":"What did they say the altar was a witness to?","choices":["That the LORD is God","That war was averted","That the tribes are one","That the Jordan is not a boundary"],"answer":0,"ref":"Joshua 22:34","note":"The simplest confession in the chapter, and the one everything else hung on."},{"cat":"Ed — The Witness","level":"intermediate","q":"What happened to the altar afterward?","choices":["It was moved to Shiloh","Scripture does not say — it simply stood as a witness","It was dismantled","It was rebuilt in stone"],"answer":1,"ref":"Joshua 22:34","note":"It had no function. It just stood there being true. Some memorials work exactly that way."},{"cat":"Ed — The Witness","level":"expert","q":"What is the lesson of Joshua 22:30–34?","choices":["The unity of the tribes","Reconciliation, named memory, and praise displacing panic","The judgment of the priest","The reward of patience"],"answer":1,"ref":"Theme — Week 4","note":"The chapter that opens with an army assembling closes with a nation blessing God. Between them was one conversation."}]},{"id":"where-are-the-fish","title":"Where Are the Fish?","subtitle":"John 21 — casting nets, and coming up empty","cards":[{"cat":"The Night They Caught Nothing","level":"intermediate","q":"By which sea does John 21 take place?","choices":["The Great Sea","The Sea of Tiberias","The Dead Sea","The Sea of Reeds"],"answer":1,"ref":"John 21:1","note":"John's name for the Sea of Galilee. Same water where they were first called — the story circles back to where it began."},{"cat":"The Night They Caught Nothing","level":"intermediate","q":"How many disciples were present at this fishing trip?","choices":["Twelve","Three","Eleven","Seven"],"answer":3,"ref":"John 21:2","note":"Peter, Thomas, Nathanael, the two sons of Zebedee, and two unnamed. John leaves room for you in the boat."},{"cat":"The Night They Caught Nothing","level":"beginner","q":"Who announced, 'I am going fishing'?","choices":["Thomas","Simon Peter","John","Nathanael"],"answer":1,"ref":"John 21:3","note":"Peter leads — he always does. The question is what he's leading them back to."},{"cat":"The Night They Caught Nothing","level":"beginner","q":"How did the other disciples respond to Peter's announcement?","choices":["Stay and wait for the Lord","We will go with you","They said nothing","It is not lawful"],"answer":1,"ref":"John 21:3","note":"Nobody argued. Where Peter went, the boat went — which is exactly why leadership drifting back to the old life is dangerous."},{"cat":"The Night They Caught Nothing","level":"beginner","q":"What did they catch that night?","choices":["Enough to sell","A few small fish","Nothing","One large fish"],"answer":2,"ref":"John 21:3","note":"Professionals. Home water. All night. Nothing. Skill and effort are not the same thing as fruit."},{"cat":"The Night They Caught Nothing","level":"intermediate","q":"What was fishing to these men?","choices":["Something they had never done","Their trade and identity before Christ called them","A hobby they enjoyed","A command from Jesus"],"answer":1,"ref":"Matthew 4:18–20","note":"This isn't a men's retreat. It's men going back to what they knew when they no longer knew what to do next."},{"cat":"The Night They Caught Nothing","level":"intermediate","q":"In which earlier account did Peter also fish all night and take nothing?","choices":["John 6","Matthew 14","Mark 6","Luke 5"],"answer":3,"ref":"Luke 5:5","note":"'Master, we toiled all night and took nothing.' Peter has been in this exact boat before — empty, at dawn, with Jesus on the way."},{"cat":"The Night They Caught Nothing","level":"expert","q":"What does the sermon's first point claim?","choices":["Only apostles may fish","Fishing without Jesus is forbidden","We cannot fish without Jesus at all","We can fish without Jesus — we just cannot catch anything"],"answer":3,"ref":"Point I — John 21:3","note":"The boat still launches. The nets still go out. Nothing stops you from working — that's what makes an empty night so easy to repeat."},{"cat":"Jesus Knows Where the Fish Are","level":"intermediate","q":"At what hour did Jesus stand on the shore?","choices":["At sunset","Just as day was breaking","At the sixth hour","At midnight"],"answer":1,"ref":"John 21:4","note":"He came at the end of the wasted night, not the start. He was on the shore before they knew they needed Him."},{"cat":"Jesus Knows Where the Fish Are","level":"beginner","q":"Did the disciples recognize Jesus at first?","choices":["Only after He ate with them","Only Peter did","No — they did not know it was Jesus","Yes, immediately"],"answer":2,"ref":"John 21:4","note":"A recurring resurrection pattern — Mary at the tomb, the Emmaus road, here. He is present long before He is perceived."},{"cat":"Jesus Knows Where the Fish Are","level":"intermediate","q":"How did Jesus address the men in the boat?","choices":["Children","Fishermen","Brothers","Friends"],"answer":0,"ref":"John 21:5","note":"'Paidia' — the tone is a father calling in from the porch. No rebuke for the empty night. Just affection, and a question."},{"cat":"Jesus Knows Where the Fish Are","level":"beginner","q":"What did Jesus ask them from the shore?","choices":["Do you have any fish?","Why have you returned here?","Where is your faith?","Do you love me?"],"answer":0,"ref":"John 21:5","note":"He knew the answer. The question wasn't for information — it was to make them say the empty night out loud."},{"cat":"Jesus Knows Where the Fish Are","level":"beginner","q":"What was their answer?","choices":["No","Who is asking?","We have not tried the deep","Only a few"],"answer":0,"ref":"John 21:5","note":"One word. The whole night in one syllable. Honest accounting is where the miracle starts."},{"cat":"Jesus Knows Where the Fish Are","level":"beginner","q":"What did Jesus tell them to do?","choices":["Come ashore and rest","Wait until evening","Cast the net on the right side of the boat","Launch out into the deep"],"answer":2,"ref":"John 21:6","note":"They'd been casting all night. He didn't change the work — He changed the side. Obedience in the smallest adjustment."},{"cat":"Jesus Knows Where the Fish Are","level":"intermediate","q":"Who first recognized the man on the shore?","choices":["Thomas","Peter","The disciple whom Jesus loved","Nathanael"],"answer":2,"ref":"John 21:7","note":"'It is the Lord!' John recognizes Him by the miracle — he had seen this catch before, in Luke 5. Memory is a form of discernment."},{"cat":"Jesus Knows Where the Fish Are","level":"beginner","q":"What did Peter do when he heard it was the Lord?","choices":["Hid among the nets","Steered the boat to shore","Fell to his knees in the boat","Put on his outer garment and threw himself into the sea"],"answer":3,"ref":"John 21:7","note":"He dresses to swim — which makes no sense, unless you've denied a man and can't wait one more minute to reach him."},{"cat":"Fishing on the Right Side","level":"expert","q":"What natural advantage does the right side of the boat have for fishing?","choices":["None — the difference was obedience, not technique","The nets hang deeper","The current runs stronger there","Fish avoid the shadow of the boat"],"answer":0,"ref":"John 21:6","note":"That is the whole point. If the right side worked better, they'd have found it in twenty years of fishing. It worked because He said it."},{"cat":"Fishing on the Right Side","level":"beginner","q":"Complete Matthew 4:19: 'Follow me, and I will make you…'","choices":["witnesses to the nations","heirs of the kingdom","fishers of men","shepherds of Israel"],"answer":2,"ref":"Matthew 4:19","note":"'I will make you.' The becoming is His work. Our part is the following."},{"cat":"Fishing on the Right Side","level":"intermediate","q":"What did Jesus tell Simon to do in Luke 5:4?","choices":["Launch out into the deep and let down your nets","Cast on the right side","Wait until morning","Come and follow me"],"answer":0,"ref":"Luke 5:4","note":"Deep water, daylight — everything a fisherman knows is wrong. Obedience often looks like bad technique."},{"cat":"Fishing on the Right Side","level":"intermediate","q":"What was Peter's reply before the great catch in Luke 5?","choices":["Let another boat try","We have toiled enough","Master, it is too late","At your word I will let down the nets"],"answer":3,"ref":"Luke 5:5","note":"Six words that turn an empty night around. He didn't feel faith — he acted on a word."},{"cat":"Fishing on the Right Side","level":"intermediate","q":"According to Acts 1:8, how far does the fishing ground extend?","choices":["To Judea only","To the end of the earth","To the cities of the Decapolis","To the house of Israel"],"answer":1,"ref":"Acts 1:8","note":"Jerusalem, Judea, Samaria, the ends of the earth. Nobody gets to say the water near them is out of bounds."},{"cat":"Fishing on the Right Side","level":"intermediate","q":"What does Jesus say about the fields in John 4:35?","choices":["They will ripen in four months","They are already white for harvest","They are barren","They belong to another sower"],"answer":1,"ref":"John 4:35","note":"'Lift up your eyes.' The delay was never in the harvest. It was in the looking."},{"cat":"Fishing on the Right Side","level":"intermediate","q":"What does Paul ask in Romans 10:14?","choices":["Who has believed our report?","Shall we continue in sin?","Who shall separate us?","How shall they hear without someone preaching?"],"answer":3,"ref":"Romans 10:14","note":"The fish do not swim to the boat. Somebody has to go out on the water."},{"cat":"Fishing on the Right Side","level":"beginner","q":"What does Jesus say about the harvest and the laborers?","choices":["The harvest is small but the laborers are many","The harvest belongs to the angels","The harvest is not yet","The harvest is plentiful but the laborers are few"],"answer":3,"ref":"Matthew 9:37–38","note":"He diagnoses a labor shortage, then tells them to pray for workers — and in the next chapter, sends them. Pray that prayer carefully."},{"cat":"When the Nets Break","level":"intermediate","q":"What happened the moment they cast on the right side?","choices":["The net snapped at once","The boat capsized","They could not haul the net in for the quantity of fish","One great fish was taken"],"answer":2,"ref":"John 21:6","note":"Same men, same net, same water, same minute. The only variable that changed was a word from the shore."},{"cat":"When the Nets Break","level":"beginner","q":"How many fish were in the net?","choices":["120","500","153 large fish","70"],"answer":2,"ref":"John 21:11","note":"John counted. A man who has just seen the risen Christ stops to count fish — because it happened, and eyewitnesses notice numbers."},{"cat":"When the Nets Break","level":"intermediate","q":"What does John note about the net despite the load?","choices":["It was not torn","It broke in three places","It was lost in the deep","It had to be cut free"],"answer":0,"ref":"John 21:11","note":"In Luke 5 the nets were breaking; here the net holds. Between the two accounts stands the resurrection."},{"cat":"When the Nets Break","level":"intermediate","q":"What happened to the nets and boats in the Luke 5 catch?","choices":["The nets were breaking and the boats began to sink","The nets were lost","The boats reached shore easily","Both held firm"],"answer":0,"ref":"Luke 5:6–7","note":"Obedience produced more than their equipment could carry. That's the sermon's fourth point — when we obey, the nets break."},{"cat":"When the Nets Break","level":"intermediate","q":"Who hauled the net ashore?","choices":["Simon Peter, by himself","The sons of Zebedee","All seven together","Jesus"],"answer":0,"ref":"John 21:11","note":"Seven men couldn't drag it in the boat; Peter drags it up the beach alone. Strength shows up in the presence of the One you failed."},{"cat":"When the Nets Break","level":"intermediate","q":"What was already waiting on the shore?","choices":["A crowd of villagers","A charcoal fire with fish on it, and bread","An empty beach","The other disciples"],"answer":1,"ref":"John 21:9","note":"He asked for their fish while His own were already cooking. He never needed the catch. He wanted the fishermen."},{"cat":"When the Nets Break","level":"expert","q":"The Greek word for that charcoal fire appears only twice in John. Where else?","choices":["The fire at the tomb","The fire in the temple court","The fire where Peter denied Jesus","The fire of Pentecost"],"answer":2,"ref":"John 18:18; 21:9","note":"'Anthrakia.' Peter smells that smell again and it's not an accident. Jesus rebuilt the scene of the failure — then asked him three times if he loved Him."},{"cat":"When the Nets Break","level":"expert","q":"What does Ezekiel 47 picture where the river from the temple flows?","choices":["A dry riverbed","A sea without life","A closed gate","Fishermen spreading nets, with fish exceedingly many"],"answer":3,"ref":"Ezekiel 47:9–10","note":"Wherever the river goes, everything lives. The prophets were promising full nets long before anyone rowed out on Galilee."}]},{"id":"mother-in-israel","title":"A Mother in Israel","subtitle":"Judges 4–5 — courage, hesitation, and the song after","cards":[{"cat":"Twenty Years of Iron","level":"intermediate","q":"Which Canaanite king oppressed Israel in Judges 4?","choices":["Adoni-zedek of Jerusalem","Og of Bashan","Eglon of Moab","Jabin, who reigned in Hazor"],"answer":3,"ref":"Judges 4:2","note":"Hazor had already been burned once, under Joshua. Old enemies rebuild when a generation stops watching."},{"cat":"Twenty Years of Iron","level":"beginner","q":"Who commanded Jabin's army?","choices":["Barak","Heber the Kenite","Shamgar","Sisera, of Harosheth-hagoyim"],"answer":3,"ref":"Judges 4:2","note":"The general, not the king, is the name everyone feared. Jabin gives the orders; Sisera is the reason nobody travels the roads."},{"cat":"Twenty Years of Iron","level":"intermediate","q":"How many chariots of iron did Sisera command?","choices":["Ninety","Nine hundred","Ten thousand","Three hundred"],"answer":1,"ref":"Judges 4:3","note":"Iron against a people with almost no metal. This is a technology gap, not a fair fight — which is exactly why the Kishon matters later."},{"cat":"Twenty Years of Iron","level":"intermediate","q":"How long did Sisera oppress Israel cruelly?","choices":["Forty years","Eighteen months","Seven years","Twenty years"],"answer":3,"ref":"Judges 4:3","note":"Twenty years is long enough for a child to be born, grow up, and never once know a free road."},{"cat":"Twenty Years of Iron","level":"beginner","q":"What set the oppression in motion?","choices":["Israel again did evil after Ehud died","Deborah had not yet arisen","The tribes divided the land wrongly","Israel refused to fight"],"answer":0,"ref":"Judges 4:1","note":"The book's engine. Deliverer dies, memory fades, the cycle restarts. Judges is the story of what one generation forgets."},{"cat":"Twenty Years of Iron","level":"expert","q":"What does the Song say happened to the highways in those days?","choices":["They filled with merchants","They were paved by Sisera","They were closed by Israel","They were abandoned, and travelers kept to the byways"],"answer":3,"ref":"Judges 5:6","note":"You can measure an occupation by whether people use the main road. Fear reroutes ordinary life first."},{"cat":"Twenty Years of Iron","level":"expert","q":"What question does the Song ask about Israel's weapons?","choices":["Shall the bow of Ephraim be broken?","Who will bear the sword of the LORD?","Was there a shield or spear to be seen among forty thousand?","Where are the chariots of Israel?"],"answer":2,"ref":"Judges 5:8","note":"The answer is no. Israel goes to war against nine hundred iron chariots essentially unarmed — which is the setup, not the tragedy."},{"cat":"Twenty Years of Iron","level":"expert","q":"According to the Song, what had ceased in Israel until Deborah arose?","choices":["The villagers — village life itself","The sacrifices","The prophets","The harvest"],"answer":0,"ref":"Judges 5:7","note":"Not the army. The villages. Oppression doesn't just lose battles — it empties ordinary life, and that's what she rose to restore."},{"cat":"Courage Isn't Gender-Bound","level":"intermediate","q":"How does Judges 4:4 introduce Deborah?","choices":["The mother of Barak","A widow raised up in the crisis","A prophetess, the wife of Lappidoth, judging Israel at that time","A singer in Israel"],"answer":2,"ref":"Judges 4:4","note":"Three descriptors, no apology, no explanation. The text spends more words justifying Barak's hesitation than her authority."},{"cat":"Courage Isn't Gender-Bound","level":"intermediate","q":"Where did Deborah hold court?","choices":["Under the palm of Deborah, between Ramah and Bethel","In the tent of meeting","On Mount Tabor","At the gate of Hazor"],"answer":0,"ref":"Judges 4:5","note":"A tree in the hill country of Ephraim, named after her. The landmark carried her name before the victory did."},{"cat":"Courage Isn't Gender-Bound","level":"beginner","q":"What did the people of Israel come up to Deborah for?","choices":["Judgment","Refuge from Sisera","Prophecy only","Blessing"],"answer":0,"ref":"Judges 4:5","note":"They came up to her. She wasn't summoned, appointed in the crisis, or tolerated — she was already the one they came to."},{"cat":"Courage Isn't Gender-Bound","level":"intermediate","q":"Whom did Deborah summon, and from where?","choices":["Barak son of Abinoam, from Kedesh-naphtali","Heber, from Zaanannim","Gideon, from Ophrah","Shamgar, from Anath"],"answer":0,"ref":"Judges 4:6","note":"She doesn't raise an army herself. She sends for the man who should already be leading one."},{"cat":"Courage Isn't Gender-Bound","level":"intermediate","q":"How did Deborah phrase the command to Barak?","choices":["I have seen a vision for you","Has not the LORD, the God of Israel, commanded you?","The elders have chosen you","Thus says the LORD to me concerning you"],"answer":1,"ref":"Judges 4:6","note":"A question, not a new revelation. The word had already reached Barak and stalled. She isn't delivering orders — she's asking why he's still sitting down."},{"cat":"Courage Isn't Gender-Bound","level":"intermediate","q":"Where was Barak to gather his men, and how many?","choi
