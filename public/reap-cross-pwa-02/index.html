ces":["Hazor — one thousand from Issachar","Kedesh — forty thousand from all Israel","The Kishon — five thousand from Ephraim","Mount Tabor — ten thousand from Naphtali and Zebulun"],"answer":3,"ref":"Judges 4:6","note":"High ground, where chariots can't climb. The battle plan was tactically sound before it was ever miraculous."},{"cat":"Courage Isn't Gender-Bound","level":"intermediate","q":"Where did God say He would draw out Sisera?","choices":["The plain of Jezreel","The heights of Tabor","The river Kishon","The gates of Hazor"],"answer":2,"ref":"Judges 4:7","note":"God names the ground before the fight. Nine hundred chariots in a riverbed is a fleet in a trap — and the Song tells us why."},{"cat":"Courage Isn't Gender-Bound","level":"expert","q":"What is the point of the sermon's first movement?","choices":["Leadership belongs to prophets","Deborah proves male failure","Women should lead only in a crisis","Faithfulness, not gender, is the qualifier for usefulness to God"],"answer":3,"ref":"Point I — Judges 4:4–9","note":"An observation about how God worked in this story — held honestly, not flattened into every leadership question in the church."},{"cat":"Barak's Hesitation","level":"beginner","q":"What condition did Barak attach to obeying?","choices":["Let Ephraim come and I will go","If you go with me I will go; if not, I will not go","Give me a sign and I will go","Give me chariots and I will go"],"answer":1,"ref":"Judges 4:8","note":"Not villainy. Half-obedience. He wanted the prophetic voice in the chariot with him — and faith that needs a chaperone still costs something."},{"cat":"Barak's Hesitation","level":"intermediate","q":"How did Deborah answer his condition?","choices":["I will not go with you","The road you are going will not lead to your glory — the LORD will sell Sisera into the hand of a woman","Then Israel will fall","You have forfeited the battle"],"answer":1,"ref":"Judges 4:9","note":"She goes anyway. The mission is not withdrawn; the honor is simply rerouted. God's plan doesn't stall on our hesitation."},{"cat":"Barak's Hesitation","level":"expert","q":"Was the loss of glory a punishment or a consequence?","choices":["A consequence — stated plainly, not vindictively","A prophecy of Barak's death","A curse pronounced by Deborah","A punishment from the LORD"],"answer":0,"ref":"Judges 4:9","note":"Partial obedience costs us the credit, not the outcome. God finishes the work either way — the only question is whose name is on it."},{"cat":"Barak's Hesitation","level":"intermediate","q":"What was Deborah's battle cry at Tabor?","choices":["Let the LORD arise","Fear not, stand still","Up! For this is the day the LORD has given Sisera into your hand","The sword of the LORD and of Barak"],"answer":2,"ref":"Judges 4:14","note":"'Does not the LORD go out before you?' The timing wasn't Barak's to pick. He needed someone to tell him the day had come."},{"cat":"Barak's Hesitation","level":"intermediate","q":"What became of Sisera's nine hundred chariots?","choices":["They withdrew to Hazor","They were captured intact","The LORD routed them, and Sisera fled away on foot","They scattered into Jezreel"],"answer":2,"ref":"Judges 4:15","note":"The most feared man in the region ends up running on his own two feet. Every advantage he had became weight in the mud."},{"cat":"Barak's Hesitation","level":"intermediate","q":"Whose tent did Sisera flee to, and why?","choices":["A shepherd's — he knew no one there","Jael's — there was peace between Jabin and the house of Heber the Kenite","His mother's — for refuge","Deborah's — to sue for terms"],"answer":1,"ref":"Judges 4:17","note":"He ran to the one place he was certain was safe. The treaty was real. The calculation was reasonable. It was still the last mistake he made."},{"cat":"Barak's Hesitation","level":"intermediate","q":"What did Sisera ask Jael for, and what did she give him?","choices":["He asked for silence; she gave him a song","He asked for a horse; she gave him a cloak","He asked for water; she gave him milk","He asked for bread; she gave him wine"],"answer":2,"ref":"Judges 4:19; 5:25","note":"The Song lingers on this — milk in a noble's bowl. She gave him more than he asked for, and it put him to sleep."},{"cat":"Barak's Hesitation","level":"intermediate","q":"What did Jael say when Barak arrived?","choices":["Come, and I will show you the man whom you are seeking","The LORD has given him to me","Ask me nothing","He is not here"],"answer":0,"ref":"Judges 4:22","note":"Deborah's word lands in one sentence. Barak arrives to find the war already finished by someone outside the chain of command."},{"cat":"The Song of Deborah","level":"beginner","q":"Who sang the song of Judges 5, and when?","choices":["The tribes at Shiloh, a year later","Deborah and Barak, on that day — after the victory","Deborah alone, before the battle","Jael, over Sisera's body"],"answer":1,"ref":"Judges 5:1","note":"Widely held to be among the oldest poetry in the Hebrew Bible. And sung together — Barak lost the glory, not his place in the choir."},{"cat":"The Song of Deborah","level":"beginner","q":"What does Deborah call herself in the Song?","choices":["A mother in Israel","The LORD's prophetess","A sword in Israel","A judge of Israel"],"answer":0,"ref":"Judges 5:7","note":"Not 'a general.' Leadership defined as nurture and protection — she arose so the villages could live again, not so she could win."},{"cat":"The Song of Deborah","level":"expert","q":"Which two tribes does the Song praise for risking their lives to the death?","choices":["Judah and Benjamin","Ephraim and Manasseh","Dan and Asher","Zebulun and Naphtali"],"answer":3,"ref":"Judges 5:18","note":"The two tribes Deborah named at the start are the two that showed up. The Song keeps the receipts."},{"cat":"The Song of Deborah","level":"expert","q":"Which tribe does the Song ask why it sat still among the sheepfolds?","choices":["Simeon","Levi","Reuben","Gad"],"answer":2,"ref":"Judges 5:15–16","note":"'Great searchings of heart.' Reuben held long meetings about it. Deliberation became the alibi."},{"cat":"The Song of Deborah","level":"expert","q":"Which town does the angel of the LORD curse in the Song?","choices":["Bethel","Kedesh","Meroz","Hazor"],"answer":2,"ref":"Judges 5:23","note":"Cursed not for fighting against Israel — for not coming. The only town in Scripture damned by an absence."},{"cat":"The Song of Deborah","level":"intermediate","q":"What does the Song say fought against Sisera from heaven?","choices":["The angel of the LORD","The four winds","The chariots of fire","The stars, from their courses"],"answer":3,"ref":"Judges 5:20","note":"Poetry for a storm. Read it with the next verse — the rain came, the wadi rose, and iron chariots became anchors."},{"cat":"The Song of Deborah","level":"intermediate","q":"What swept Sisera's army away?","choices":["The east wind","The torrent Kishon","The sea","A landslide from Tabor"],"answer":1,"ref":"Judges 5:21","note":"'The ancient torrent, the torrent Kishon.' God chose the battlefield in 4:7. The trap was set before Barak ever climbed the mountain."},{"cat":"The Song of Deborah","level":"intermediate","q":"Who is pictured watching at the window through the lattice?","choices":["Jael","Sisera's mother","Deborah","Jabin's queen"],"answer":1,"ref":"Judges 5:28–30","note":"The Song ends at a window, with a mother counting the spoil her son will bring home — including captive girls. It refuses to let you cheer without seeing the cost."}]},{"id":"rising-line","title":"The Rising Line","subtitle":"Adam, Noah, Christ — one thread of obedience","cards":[{"cat":"One Man Broke It — Adam","level":"intermediate","q":"In Romans 5:19, how many men does Paul name to explain how sin and righteousness reach the many?","choices":["Two","Three","Seven","Twelve"],"answer":0,"ref":"Romans 5:19","note":"Paul names only Adam and Christ — two heads of two humanities. Every person is represented by one or the other."},{"cat":"One Man Broke It — Adam","level":"beginner","q":"According to Romans 5:12, sin entered the world through what?","choices":["The serpent","One man","A whole nation","The giving of the law"],"answer":1,"ref":"Romans 5:12","note":"Sin “came into the world through one man.” God hangs the fate of the many on the choice of one."},{"cat":"One Man Broke It — Adam","level":"intermediate","q":"What did Adam’s disobedience do to the many, according to Romans 5:19?","choices":["Made them wise","Made them free","Made them sinners","Made them kings"],"answer":2,"ref":"Romans 5:19","note":"“By the one man’s disobedience the many were made sinners.” We were represented in Adam and fell in him."},{"cat":"One Man Broke It — Adam","level":"beginner","q":"In the sermon’s image, Adam’s sin chiefly broke what?","choices":["A single tree","One commandment only","A passing promise","The line between God and man"],"answer":3,"ref":"Genesis 3","note":"Adam didn’t merely break a rule — he severed the thread running from God to man. Every child after him is born holding the broken end."},{"cat":"One Man Broke It — Adam","level":"beginner","q":"Hearing God’s voice in the garden after sinning, what did Adam do?","choices":["Hid among the trees","Ran to the altar","Called out to God","Left the garden willingly"],"answer":0,"ref":"Genesis 3:8","note":"The man made to walk with God now hides from the voice he once loved — the first picture of the broken relationship."},{"cat":"One Man Held It — Noah","level":"intermediate","q":"What does Genesis 6:22 uniquely say about Noah?","choices":["He was without sin","He did all that God commanded","He built the ark alone","He never once feared"],"answer":1,"ref":"Genesis 6:22","note":"“Noah did all that God commanded him.” He is the first man since Adam of whom complete obedience is recorded."},{"cat":"One Man Held It — Noah","level":"intermediate","q":"What did Noah’s obedience actually do about the flood?","choices":["It stopped the rain","It shortened the flood","It carried a remnant safely through it","It prevented the flood entirely"],"answer":2,"ref":"Genesis 7","note":"Noah’s obedience never cancels the wrath — the waters still rise. It carries a remnant through the middle of the judgment."},{"cat":"One Man Held It — Noah","level":"expert","q":"How many persons were brought safely through the water, according to 1 Peter 3:20?","choices":["Three","Twelve","Forty","Eight"],"answer":3,"ref":"1 Peter 3:20","note":"“Eight persons were brought safely through water” — not around it, but through it. Salvation through judgment, not instead of it."},{"cat":"One Man Held It — Noah","level":"expert","q":"Peter uses the ark and the flood as a picture of what?","choices":["Baptism","Communion","The Sabbath","Circumcision"],"answer":0,"ref":"1 Peter 3:21","note":"Peter reads the flood as a type of baptism — a people brought safely through the waters that condemned the old world."},{"cat":"One Man Held It — Noah","level":"expert","q":"What does the name “Noah” mean?","choices":["Grace","Rest","Judgment","Flood"],"answer":1,"ref":"Genesis 5:29","note":"Noah means rest. His father hoped he would bring relief from the cursed ground — a partial, passing rest that points forward."},{"cat":"One Man Held It — Noah","level":"expert","q":"Who named Noah, hoping he would bring relief from the cursed ground?","choices":["Seth","Methuselah","Lamech","Adam"],"answer":2,"ref":"Genesis 5:29","note":"Lamech named his son in hope: “this one shall bring us relief from our work and the painful toil of our hands.”"},{"cat":"One Man Held It — Noah","level":"intermediate","q":"Stepping off the ark, God re-issued which command first spoken over Adam?","choices":["Do not eat of the tree","Keep the Sabbath","Name the animals","Be fruitful and multiply"],"answer":3,"ref":"Genesis 9:1","note":"“Be fruitful and multiply and fill the earth.” Noah walks out as a kind of new Adam into a new creation."},{"cat":"One Man Held It — Noah","level":"intermediate","q":"What happened in Noah’s vineyard after the flood?","choices":["Drunkenness and shame","A great harvest","A new covenant meal","A stone altar built"],"answer":0,"ref":"Genesis 9:20–21","note":"The washed world gets dirty again. The new Adam falls in his vineyard as the first Adam fell in the garden."},{"cat":"One Man Held It — Noah","level":"intermediate","q":"What did the tower of Babel reveal about the world after the flood?","choices":["It stayed sinless","It fell like the old one","It was drowned again","It was abandoned by God"],"answer":1,"ref":"Genesis 11","note":"The multiplied children of the new Adam build against heaven. The fresh start falls exactly like the first."},{"cat":"One Man Held It — Noah","level":"expert","q":"Why, in the sermon, could Noah’s obedience not finally save humanity?","choices":["It was incomplete","He abandoned God","It washed the earth but not the heart","God rejected his sacrifice"],"answer":2,"ref":"Genesis 8–9","note":"The flood scoured the earth clean but could not reach the heart of the man who stepped off the boat. That needed a deeper obedience."},{"cat":"One Man Mended It — Christ","level":"expert","q":"Paul calls Jesus by which title, setting Him against the first man?","choices":["The second Noah","The new Lamech","The second Moses","The last Adam"],"answer":3,"ref":"1 Corinthians 15:45","note":"Christ is “the last Adam” — the true head of a new humanity, undoing what the first Adam did."},{"cat":"One Man Mended It — Christ","level":"beginner","q":"According to Philippians 2:8, Christ was obedient to what point?","choices":["Death on a cross","The wilderness","The temple","The Jordan"],"answer":0,"ref":"Philippians 2:8","note":"“Obedient to the point of death, even death on a cross.” His obedience goes all the way down where Noah’s could not."},{"cat":"One Man Mended It — Christ","level":"expert","q":"How did the first Adam’s reach differ from the last Adam’s obedience?","choices":["Both reached upward","Adam reached up in pride; Christ reached down in death","Both reached downward","Neither truly reached"],"answer":1,"ref":"Genesis 3; Philippians 2","note":"Adam grasped upward to be like God; Christ humbled Himself downward to death. The direction of the reach makes all the difference."},{"cat":"One Man Mended It — Christ","level":"expert","q":"In the sermon’s flood picture, Jesus does not ride over the judgment — He does what?","choices":["Delays it","Escapes it","Goes down into it","Merely watches it"],"answer":2,"ref":"Matthew 27","note":"Noah rode over the waters in an ark. Jesus goes down into the waters of wrath — becoming the ark in which sinners are carried through."},{"cat":"One Man Mended It — Christ","level":"beginner","q":"What does Christ’s obedience produce that Noah’s fresh start never could?","choices":["A larger ark","A longer lifespan","A new set of laws","A new creation"],"answer":3,"ref":"2 Corinthians 5:17","note":"“If anyone is in Christ, he is a new creation.” Not the earth washed while the man stays dirty — the man himself made new."},{"cat":"One Man Mended It — Christ","level":"beginner","q":"Who gives the true rest that Noah’s name only foreshadowed?","choices":["Jesus","The law","The prophets","The Sabbath day"],"answer":0,"ref":"Matthew 11:28","note":"The rest Lamech hoped for and Noah could only picture, Jesus simply is: “Come to me… and I will give you rest.”"},{"cat":"One Man Mended It — Christ","level":"beginner","q":"In Matthew 11:28, Jesus invites whom to come to Him for rest?","choices":["The righteous only","All who labor and are heavy laden","The priests alone","Israel only"],"answer":1,"ref":"Matthew 11:28","note":"The invitation is wide open: all who labor and are heavy laden — the very people the law and the flood could never relieve."},{"cat":"One Man Mended It — Christ","level":"intermediate","q":"Paul says there are how many grounds to stand on — in Adam or in Christ?","choices":["Four","Three","Two","One"],"answer":2,"ref":"Romans 5","note":"Only two: in Adam, where the line is broken, or in Christ, where it is mended. Even Noah offers no third ground — his story sends us to Christ."},{"cat":"One Man Mended It — Christ","level":"beginner","q":"What is the sermon’s final charge to the hearer?","choices":["Be a better Noah","Build a personal ark","Wait for another flood","Get out of Adam and into Christ"],"answer":3,"ref":"Romans 5:17","note":"You can’t out-obey Noah to fix Adam’s break — that road ends at a vineyard. The gospel is to leave the old world and be found in Christ."}]}];
  var DECK = DECKS[0];
  var CAT_ORDER = [];
  var app = document.getElementById("app");
  var total = DECK.cards.length;
  var state = { screen:"pick", i:0, picked:null, score:0 };

  function bestKey(){ return "reap_cross_best_" + (DECK.id || "default"); }
  function getBest() { try { var v = localStorage.getItem(bestKey()); return v===null?null:parseInt(v,10); } catch(e){ return null; } }
  function setBest(v) { try { localStorage.setItem(bestKey(), String(v)); } catch(e){} }

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function syncDeck(deck){
    DECK = deck;
    total = DECK.cards.length;
    CAT_ORDER = [];
    var seen = {};
    DECK.cards.forEach(function(c){
      if(!seen[c.cat]){ seen[c.cat]=true; CAT_ORDER.push(c.cat); }
    });
  }

  function catCounts(){ var m={}; DECK.cards.forEach(function(c){ m[c.cat]=(m[c.cat]||0)+1; }); return m; }

  function resultMessage(s,t){
    var p=s/t;
    if(p===1) return "Every card. You know this well.";
    if(p>=.75) return "Strong. The story and its weight are in you.";
    if(p>=.5) return "Good ground covered — worth another pass.";
    return "A good place to begin. Run it again.";
  }

  function selectDeck(idx){
    syncDeck(DECKS[idx]);
    state.screen="start";
    state.i=0; state.picked=null; state.score=0;
    render();
  }

  function begin(){ state.screen="quiz"; state.i=0; state.picked=null; state.score=0; render(); }
  function choose(idx){
    if(state.picked!==null) return;
    state.picked=idx;
    if(idx===DECK.cards[state.i].answer) state.score++;
    render();
  }
  function next(){
    if(state.i+1<total){ state.i++; state.picked=null; render(); }
    else {
      var b=getBest(); if(b===null||state.score>b) setBest(state.score);
      state.screen="results"; render();
    }
  }

  function renderPick(){
    var list = DECKS.map(function(d, idx){
      return '<button class="deck-btn" data-idx="'+idx+'">'+
        '<div class="serif" style="font-size:22px;font-weight:700;color:var(--cream);margin:0 0 6px">'+esc(d.title)+'</div>'+
        '<div style="font-size:14px;line-height:1.45;color:rgba(237,231,216,.7);margin:0 0 10px">'+esc(d.subtitle)+'</div>'+
        '<span class="chip">'+d.cards.length+' cards</span>'+
      '</button>';
    }).join("");
    app.innerHTML =
      '<div class="center">'+
        '<div class="eyebrow" style="margin-bottom:18px">Reap&nbsp;Threads&nbsp;·&nbsp;Trivia</div>'+
        '<h1 class="serif" style="font-size:40px;line-height:1.05;margin:0 0 14px;color:var(--cream);font-weight:700">Choose a deck</h1>'+
        '<hr class="rule" style="margin:0 auto 22px" />'+
        '<p style="font-size:15px;color:rgba(237,231,216,.7);margin:0 0 22px;line-height:1.5">'+DECKS.length+' decks · answer, then turn the card for the Word behind it.</p>'+
        '<div class="col" style="text-align:left">'+list+'</div>'+
      '</div>';
    Array.prototype.forEach.call(app.querySelectorAll(".deck-btn"), function(btn){
      btn.addEventListener("click", function(){ selectDeck(parseInt(btn.getAttribute("data-idx"),10)); });
    });
  }

  function renderStart(){
    var counts=catCounts(), best=getBest();
    var chips=CAT_ORDER.map(function(c){ return '<span class="chip">'+esc(c)+' · '+(counts[c]||0)+'</span>'; }).join("");
    app.innerHTML =
      '<div class="center">'+
        '<div class="eyebrow" style="margin-bottom:18px">Reap&nbsp;Threads&nbsp;·&nbsp;Trivia</div>'+
        '<h1 class="serif" style="font-size:46px;line-height:1.05;margin:0 0 14px;color:var(--cream);font-weight:700">'+esc(DECK.title)+'</h1>'+
        '<hr class="rule" style="margin:0 auto 18px" />'+
        '<p style="font-size:16px;color:rgba(237,231,216,.75);margin:0 0 26px;line-height:1.5">'+esc(DECK.subtitle)+'. '+total+' cards — answer, then turn the card for the Word behind it.</p>'+
        '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:30px">'+chips+'</div>'+
        '<button id="begin" class="primary" style="padding:15px 40px;border-radius:999px;font-size:17px">Begin the deck</button>'+
        (best!==null ? '<p style="margin-top:20px;font-size:14px;color:var(--goldBright)">Best so far · '+best+'/'+total+'</p>' : '')+
        '<div style="margin-top:18px"><button id="backDecks" class="ghost" style="padding:11px 22px;border-radius:999px;font-size:14px">All decks</button></div>'+
        '<p style="margin-top:28px;font-size:12.5px;color:rgba(237,231,216,.4);line-height:1.5">Tip: on your phone, use “Add to Home Screen” to install it like an app.</p>'+
      '</div>';
    document.getElementById("begin").addEventListener("click", begin);
    document.getElementById("backDecks").addEventListener("click", function(){ state.screen="pick"; render(); });
  }

  function answerClasses(idx, card, picked){
    if(picked===null) return "";
    if(idx===card.answer) return "border:1.5px solid var(--correctB);background:rgba(78,138,107,.22);color:var(--cream)";
    if(idx===picked) return "border:1.5px solid var(--wrongB);background:rgba(176,80,58,.20);color:var(--cream)";
    return "border:1.5px solid rgba(201,169,97,.12);background:rgba(26,37,64,.5);color:rgba(237,231,216,.45)";
  }

  function renderQuiz(){
    var card=DECK.cards[state.i], picked=state.picked, answered=picked!==null;
    var correct=answered && picked===card.answer;
    var pct=((state.i+(answered?1:0))/total)*100;
    var letters="ABCD";
    var answers=card.choices.map(function(ch,idx){
      var st=answerClasses(idx,card,picked);
      return '<button class="answer" data-idx="'+idx+'"'+(answered?' disabled':'')+(st?' style="'+st+'"':'')+'>'+
             '<span class="lbl">'+letters[idx]+'</span>'+esc(ch)+'</button>';
    }).join("");

    var teaching="";
    if(answered){
      teaching =
        '<div class="reveal" style="margin-top:22px;background:var(--cream);border-radius:15px;padding:20px 22px;box-shadow:0 14px 40px rgba(0,0,0,.45)">'+
          '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'+
            '<span class="serif" style="font-size:14px;font-weight:700;letter-spacing:.02em;color:'+(correct?'var(--correct)':'var(--wrong)')+'">'+(correct?'Correct':'Not quite')+'</span>'+
            (card.ref!=="—" ? '<span class="serif" style="font-size:14px;font-weight:700;color:var(--gold);border-left:1px solid rgba(156,122,52,.4);padding-left:10px">'+esc(card.ref)+'</span>' : '')+
          '</div>'+
          '<p style="margin:0;font-size:15.5px;line-height:1.55;color:#2A2618">'+esc(card.note)+'</p>'+
          '<button id="next" class="primary" style="margin-top:16px;padding:11px 26px;border-radius:999px;font-size:15px">'+(state.i+1<total?'Next card':'See results')+'</button>'+
        '</div>';
    }

    var levelChip = card.level ? '<span class="chip" style="margin-left:8px">'+esc(card.level)+'</span>' : '';

    app.innerHTML =
      '<div>'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap">'+
          '<span class="eyebrow">'+esc(card.cat)+'</span>'+
          '<span style="font-size:13px;color:rgba(237,231,216,.6);font-weight:600">'+(state.i+1)+' / '+total+levelChip+'</span>'+
        '</div>'+
        '<div style="height:4px;background:rgba(201,169,97,.15);border-radius:4px;margin-bottom:22px">'+
          '<div style="height:4px;width:'+pct+'%;background:var(--gold);border-radius:4px;transition:width .3s ease"></div>'+
        '</div>'+
        '<h2 class="serif" style="font-size:25px;line-height:1.25;color:var(--cream);margin:0 0 22px;font-weight:600">'+esc(card.q)+'</h2>'+
        '<div class="col">'+answers+'</div>'+
        teaching+
      '</div>';

    if(!answered){
      Array.prototype.forEach.call(app.querySelectorAll(".answer"), function(btn){
        btn.addEventListener("click", function(){ choose(parseInt(btn.getAttribute("data-idx"),10)); });
      });
    } else {
      document.getElementById("next").addEventListener("click", next);
    }
  }

  function renderResults(){
    app.innerHTML =
      '<div class="center">'+
        '<div class="eyebrow" style="margin-bottom:20px">'+esc(DECK.title)+' · Complete</div>'+
        '<div style="width:150px;height:150px;margin:0 auto 20px;border-radius:50%;border:2px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle, rgba(156,122,52,.14), transparent 70%)">'+
          '<span class="serif" style="font-size:52px;font-weight:700;color:var(--cream);line-height:1">'+state.score+'</span>'+
          '<span style="font-size:14px;color:var(--goldBright);margin-top:4px">of '+total+'</span>'+
        '</div>'+
        '<p class="serif" style="font-size:22px;color:var(--cream);margin:0 0 30px;font-weight:500">'+esc(resultMessage(state.score,total))+'</p>'+
        '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">'+
          '<button id="again" class="primary" style="padding:13px 30px;border-radius:999px;font-size:16px">Play again</button>'+
          '<button id="home" class="ghost" style="padding:13px 26px;border-radius:999px;font-size:16px">All decks</button>'+
        '</div>'+
      '</div>';
    document.getElementById("again").addEventListener("click", begin);
    document.getElementById("home").addEventListener("click", function(){ state.screen="pick"; render(); });
  }

  function render(){
    if(state.screen==="pick") renderPick();
    else if(state.screen==="start") renderStart();
    else if(state.screen==="quiz") renderQuiz();
    else renderResults();
  }

  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function(){ });
    });
  }
})();
</script>
</body>
</html>
